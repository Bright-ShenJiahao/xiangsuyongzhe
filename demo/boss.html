<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>首领 / 精英 / 组合首领 演示（局外）</title>
<style>
body{margin:0;background:#1b1410;color:#f3e6c8;font:14px/1.5 system-ui,sans-serif;display:flex;flex-wrap:wrap;min-height:100vh}
#L{flex:1 1 560px;display:flex;flex-direction:column;align-items:center;padding:8px}
canvas{background:#5b4a32;image-rendering:pixelated;max-width:100%;border:3px solid #6b4a2b;touch-action:none}
#R{flex:0 1 340px;padding:10px;background:#2a1d14;overflow:auto;max-height:100vh;box-sizing:border-box}
button{font:inherit;background:#4a3322;color:#f3e6c8;border:1px solid #8a6a44;padding:4px 10px;border-radius:3px;margin:2px;cursor:pointer}
button.on{background:#8a6a2a;border-color:#ffd27a}
h4{margin:10px 0 4px;color:#ffd890}
.row{display:flex;align-items:center;gap:6px;margin:3px 0}.row label{width:96px}.row input{flex:1}.row b{width:34px;text-align:right}

</style></head><body>
<div id="L"><canvas id="c" width="760" height="460"></canvas>
<div style="font-size:12px;opacity:.85;margin-top:4px">WASD / 方向键移动（手机：按住拖动）· <b>空格 / 双击 = 翻滚</b>（0.3 秒无敌，冷却 1.8 秒）· 勇者自动攻击最近的敌人 · <b>点敌人 = 指定先打它</b></div></div>
<div id="R">
<h4>单个对手</h4><div id="who1"></div>
<h4>精英招式（新）</h4><div id="who3"></div>
<h4>组合首领</h4><div id="who2"></div>
<div id="desc"></div>
<h4>招式（单个对手时可选）</h4><div id="pat"></div>
<div class="row"><label>子弹速度</label><input type="range" id="bs" min="40" max="220" value="110"><b id="bsV">110</b></div>
<div class="row"><label>预警时间 s</label><input type="range" id="wt" min="0.2" max="1.5" step="0.1" value="0.8"><b id="wtV">0.8</b></div>
<div class="row"><label>旁边小怪</label><input type="range" id="mn" min="0" max="20" value="4"><b id="mnV">4</b></div>
<div class="row"><button id="re">重来</button><button id="god">无敌：关</button></div>
<h4>记录</h4><div id="st" style="font-size:13px"></div>
</div>
<script src="js/data.js"></script><script src="js/sprites.js"></script>

    ctx.save(); ctx.translate(b.x, b.y); if (b.axe) { ctx.rotate(b.t * 14); ctx.fillStyle = '#d8d8e8'; ctx.fillRect(-7, -2, 14, 4); ctx.fillStyle = '#8a5a2a'; ctx.fillRect(-2, -7, 4, 14); } else { ctx.fillStyle = b.col; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-2, -2, b.r * .4, 0, 7); ctx.fill(); } ctx.restore(); }
  for (const f of fx) if (f.k === 'slash') { ctx.strokeStyle = `rgba(255,255,255,${1 - f.t * 3})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, 18, -1, 1); ctx.stroke(); }
  for (const n of nums) { if (n.t < 0) continue; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(n.txt, n.x + 1, n.y - n.t * 30 + 1); ctx.fillStyle = n.c; ctx.fillText(n.txt, n.x, n.y - n.t * 30); }
  const bar = (x, y, w, v, m, c, lb, sh) => { ctx.fillStyle = '#1a0e06'; ctx.fillRect(x - 2, y - 2, w + 4, 12); ctx.fillStyle = c; ctx.fillRect(x, y, w * Math.max(0, v / m), 8); if (sh) { ctx.fillStyle = '#ffe08a'; ctx.fillRect(x, y, w * Math.min(1, sh / m), 3); } ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(lb, x, y - 4); };
  const n = bs_.length, bw = n === 1 ? 400 : n === 2 ? 300 : 220;
  bs_.forEach((b, i) => bar(W / 2 - (n * (bw + 20) - 20) / 2 + i * (bw + 20), 24, bw, b.hp, b.max, b.dead ? '#555' : '#d0402a', ((DATA.enemies[b.set] || {}).name || b.set) + (b.ph === 2 ? ' · 二阶段' : '') + (b.dead ? (b.revT != null ? ' · 倒下（会复活）' : ' · 击败') : ''), b.shield));
  bar(16, H - 22, 160, hero.hp, hero.max, '#4ad04a', `勇者 ${Math.ceil(hero.hp)}/${hero.max}`);
  ctx.fillStyle = hero.rcd > 0 ? '#666' : '#ffd890'; ctx.font = '12px sans-serif'; ctx.fillText(hero.rcd > 0 ? `翻滚 ${hero.rcd.toFixed(1)}s` : '翻滚 OK', 190, H - 12);
  const fin = !live().length, dead = hero.hp <= 0; if (fin || dead) { ctx.fillStyle = fin ? '#ffd890' : '#ff8a6a'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(fin ? '全部击败！' : '倒下了', W / 2, H / 2); }
  st.innerHTML = `用时 ${rec.time.toFixed(1)} 秒 · 被打中 <b>${rec.hits}</b> 次 · 躲开 ${rec.dodged} 次 · 翻滚 ${rec.rolls} 次`; }
const keys = {}; let drag = null, lastTap = 0;
function roll() { if (hero.rcd > 0 || hero.roll > 0) return; hero.roll = .3; hero.rcd = 1.8; rec.rolls++; }
addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'Space') { e.preventDefault(); roll(); } if (e.key.startsWith('Arrow')) e.preventDefault(); }); addEventListener('keyup', e => keys[e.code] = 0);
const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
cv.onpointerdown = e => { const p = pos(e), hit = live().find(b => Math.abs(b.x - p.x) < 30 && p.y < b.y + 10 && p.y > b.y - 70); if (hit) { focus = hit; return; }
  const n = performance.now(); if (n - lastTap < 280) roll(); lastTap = n; drag = p; cv.onpointermove = e => drag = pos(e); }; addEventListener('pointerup', () => { drag = null; cv.onpointermove = null; });
function pickWho(k, btn) { who = k; only = null; document.querySelectorAll('#who1 button,#who2 button,#who3 button').forEach(x => x.classList.toggle('on', x === btn)); desc.innerHTML = WHO[k].d; mkPat(); reset(); }
for (const k in WHO) { const b = document.createElement('button'); b.textContent = WHO[k].n; b.onclick = () => pickWho(k, b); if (k === who) b.classList.add('on'); document.getElementById(WHO[k].solo === 2 ? 'who3' : WHO[k].solo ? 'who1' : 'who2').append(b); }
function mkPat() { const box = document.getElementById('pat'); box.innerHTML = ''; if (!WHO[who].solo) { box.innerHTML = '<small>组合首领按自己的规则出招</small>'; return; } if (WHO[who].solo === 2) { const k = WHO[who].m[0].pats[0]; box.innerHTML = `<b>${PAT[k].n}</b>：${PAT[k].d}`; return; } const B = WHO[who].m[0], L = [...new Set([...B.pats, ...(B.p2 || [])])];
  const sel = b => [...box.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b)); const all = document.createElement('button'); all.textContent = '全部轮流'; all.className = 'on'; all.onclick = () => { only = null; sel(all); }; box.append(all);
  for (const k of L) { const b = document.createElement('button'); b.textContent = PAT[k].n; b.title = PAT[k].d; b.onclick = () => { only = k; sel(b); }; box.append(b); } }
for (const [el, v] of [[bs, bsV], [wt, wtV], [mn, mnV]]) el.oninput = () => { v.textContent = el.value; if (el === mn) reset(); };
re.onclick = reset; document.getElementById('god').onclick = e => { god = !god; e.target.textContent = '无敌：' + (god ? '开' : '关'); };
let last = 0; function loop(ts) { const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; step(dt); draw(); requestAnimationFrame(loop); }
desc.innerHTML = WHO[who].d; mkPat(); reset(); Promise.resolve(SPR.load && SPR.load()).catch(() => 0); requestAnimationFrame(loop);
