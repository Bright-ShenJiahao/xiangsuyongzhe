<html lang="zh"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>局外 · 森林深处（整图 + 机关）</title>
<style>
html,body{margin:0;height:100%;background:#0b1014;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#eee;user-select:none}
canvas{display:block}
#hud{position:fixed;left:8px;top:8px;font-size:13px;line-height:1.6;text-shadow:0 1px 2px #000;pointer-events:none}

#tg button,#ed button{background:#2a2116;color:#ffd77a;border:2px solid #d9b45a;border-radius:6px;padding:5px 9px;font-size:13px}

#hp i{display:block;height:100%;background:#d33;width:100%}
#ed{display:none;position:fixed;left:8px;bottom:34px;background:rgba(20,16,10,.92);border:2px solid #d9b45a;border-radius:8px;padding:8px;font-size:13px;line-height:2}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">森林深处 · 机关版（镜头拉近 1.2）<br>WASD / 方向键移动 · 空格翻滚 · J 或右下按钮 = 震开（试击退）<br>符文石板每 30 秒亮一次，站上去 1 秒放冲击波；蘑菇被碰到会喷毒雾；捕兽夹靠近有「!」<br>深坑：走进去会掉（扣 1/3 血）；每 8 秒一次阵风，坑口卷叶提示后吸 2 秒<br>手机：左半屏拖动移动，右半屏点一下翻滚</div>

<div id="hp"><i></i></div>
<div id="ed"><b style="color:#ffd77a">编辑可走范围</b>　涂抹 = 加上；按住 Shift 或选「擦掉」= 去掉<br>
<label><input type="radio" name="em" value="1" checked> 加上</label> <label><input type="radio" name="em" value="0"> 擦掉</label>
　笔刷 <input type="range" id="brush" min="1" max="12" value="4" style="width:90px">
　<button id="bReset">恢复默认</button> <button id="bCopy">复制结果发给我</button> <button id="bDone">完成</button>
<textarea id="edOut" readonly style="display:block;width:100%;height:36px;margin-top:4px;background:#000;color:#9f9;font-size:11px"></textarea></div>

<script>

function inPoly(x, y, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }

  const rg = RUNE.ready ? .35 + .25 * Math.sin(T * 4) + RUNE.charge * .4 : 0; if (rg > 0) { g.fillStyle = `rgba(90,160,255,${rg})`; g.beginPath(); g.ellipse(RUNE.x, RUNE.y, 70, 30, 0, 0, 7); g.fill(); }

      if (Math.random() < .5) pp.push({ x: m.x + (Math.random() - .5) * 120, y: m.y + (Math.random() - .5) * 50, vx: (Math.random() - .5) * 10, vy: -12 - Math.random() * 14, t: 0, T: 1.2 + Math.random(), c: '#d8ff8a', s: 2, g: 0, glow: 1 }); }

  if (RUNE.charge > 0) { g.strokeStyle = '#fff'; g.lineWidth = 4; g.beginPath(); g.ellipse(RUNE.x, RUNE.y, 60, 26, 0, -1.57, -1.57 + 6.28 * RUNE.charge); g.stroke(); }

  im(opened ? 'thorn_dead' : 'thorn', 1338, 262, .5); im(CHEST.open ? 'chest_open' : 'chest', CHEST.x, CHEST.y + 14, .34); }
// 阵风：8 秒一轮，前 1 秒提示，后 2 秒吸

const windPhase = () => { const t = windT % 8; return t < 5 ? 0 : t < 6 ? 1 : t < 8 ? 2 : 0; };
const K = {}; addEventListener('keydown', e => { K[e.code] = 1; if (e.code === 'Space') doRoll(); if (e.code === 'KeyJ') push(); }); addEventListener('keyup', e => K[e.code] = 0);

addEventListener('pointermove', e => { if (EDIT && paint === e.pointerId) doPaint(e); if (joy && e.pointerId === joy.id) { joy.x = e.clientX; joy.y = e.clientY; } });

  if (joy) { const dx = joy.x - joy.x0, dy = joy.y - joy.y0, d = Math.hypot(dx, dy); if (d > 8) { x = dx / Math.max(d, 40); y = dy / Math.max(d, 40); } }

E('bPush').onclick = push;
E('bMask').onclick = e => { showMask = !showMask; e.target.textContent = showMask ? '隐藏可走范围' : '显示可走范围'; };
E('bFoe').onclick = () => spawnFoes(6);

E('bReset').onclick = () => { gridDefault(); save(); };

function fr(set, names) { const S = SPR.sets[set]; if (!S || !S.f) return null; for (const n of names) if (S.f[n]) return n; return S.f.idle0 ? 'idle0' : Object.keys(S.f)[0]; }

const HS = 115; let last = performance.now(), T = 0, cam = { x: hero.x, y: hero.y };
