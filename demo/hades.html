<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>局外 · 哈迪斯式手感 demo</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#eee;user-select:none}
canvas{display:block;margin:auto;image-rendering:pixelated}
#hud{position:fixed;left:8px;top:8px;font-size:14px;line-height:1.5;pointer-events:none;text-shadow:0 1px 2px #000}
#pick{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);flex-wrap:wrap;padding:12px}
#pick div{width:200px;max-width:42vw;padding:14px;border:3px solid #d9b45a;background:#2a2116;cursor:pointer;border-radius:6px}
#pick b{display:block;color:#ffd77a;margin-bottom:6px}
.tb{position:fixed;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);display:none;align-items:center;justify-content:center;font-size:15px}
.touch .tb{display:flex}
#bA{right:28px;bottom:40px;width:92px;height:92px}#bD{right:136px;bottom:30px}#bS{right:40px;bottom:150px}
#help{position:fixed;right:8px;top:8px;font-size:12px;opacity:.7;text-align:right;pointer-events:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div><div id="help">WASD 移动 · J / 鼠标左键 普攻(三连) · 空格 冲刺(无敌) · K 蓄力重击<br>自动技能清完房间三选一获得</div>
<div id="pick"></div>
<div class="tb" id="bA">攻击</div><div class="tb" id="bD">冲刺</div><div class="tb" id="bS">重击</div>
<script src="js/data.js"></script><script src="js/sprites.js"></script>
<script>
// 11/24 局外 demo：哈迪斯式 = 手动普攻 + 冲刺 + 自动技能（祝福），怪少而硬、有前摇提示，一房一房清
const cv = document.getElementById('c'), g = cv.getContext('2d'), W = 640, H = 400; let SC = 1;
function fit() { SC = Math.min(innerWidth / W, innerHeight / H); cv.width = W; cv.height = H; cv.style.width = W * SC + 'px'; cv.style.height = H * SC + 'px'; cv.style.marginTop = (innerHeight - H * SC) / 2 + 'px'; } addEventListener('resize', fit); fit();
const touch = matchMedia('(pointer:coarse)').matches; if (touch) document.body.classList.add('touch'), document.getElementById('help').style.display = 'none';
const K = {}; addEventListener('keydown', e => { K[e.code] = 1; if (e.code === 'KeyJ') atk(); if (e.code === 'Space') { e.preventDefault(); dash(); } if (e.code === 'KeyK') heavyOn(); });
addEventListener('keyup', e => { K[e.code] = 0; if (e.code === 'KeyK') heavyOff(); });
let mouse = { x: W / 2, y: H / 2 }; cv.addEventListener('mousemove', e => { const r = cv.getBoundingClientRect(); mouse = { x: (e.clientX - r.left) / SC, y: (e.clientY - r.top) / SC, on: 1 }; });
cv.addEventListener('mousedown', e => { if (!touch) e.button === 2 ? heavyOn() : atk(); }); addEventListener('mouseup', e => { if (e.button === 2) heavyOff(); }); cv.oncontextmenu = e => e.preventDefault();
// 手机：左半屏摇杆
let joy = null; addEventListener('touchstart', e => { for (const t of e.changedTouches) if (t.clientX < innerWidth / 2 && !joy) joy = { id: t.identifier, x: t.clientX, y: t.clientY, dx: 0, dy: 0 }; }, { passive: false });
addEventListener('touchmove', e => { for (const t of e.changedTouches) if (joy && t.identifier === joy.id) { joy.dx = t.clientX - joy.x; joy.dy = t.clientY - joy.y; } e.preventDefault(); }, { passive: false });
addEventListener('touchend', e => { for (const t of e.changedTouches) if (joy && t.identifier === joy.id) joy = null; });
const tb = (id, dn, up) => { const b = document.getElementById(id); b.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); dn(); }); if (up) b.addEventListener('touchend', e => { e.preventDefault(); up(); }); };
tb('bA', atk); tb('bD', dash); tb('bS', heavyOn, heavyOff);

const R = (a, b) => a + Math.random() * (b - a), D = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
let hero, foes, shots, fx, nums, room, boons, stopT, shake, state, flash;
function reset() { hero = { x: W / 2, y: H - 60, hp: 100, max: 100, fx: 0, fy: -1, cd: 0, combo: 0, comboT: 0, swing: null, dashT: 0, dashCd: 0, inv: 0, heavy: 0, hvy: null, kills: 0 };
  boons = {}; room = 0; nextRoom(); }
function nextRoom() { room++; foes = []; shots = []; fx = []; nums = []; stopT = 0; shake = 0; state = 'fight'; hero.x = W / 2; hero.y = H - 50;
  const n = Math.min(2 + room, 7), types = ['brute', 'archer', 'charger'];
  for (let i = 0; i < n; i++) spawn(room % 4 === 0 && i === 0 ? 'boss' : types[(Math.random() * Math.min(3, room)) | 0]); }
const SET = { brute: 'gob_shield', archer: 'gob_archer', charger: 'gob_wolf', boss: 'gob_king' };
const TY = { brute: { hp: 90, r: 14, spd: 38, c: '#7a9a4a', dmg: 18 }, archer: { hp: 45, r: 10, spd: 45, c: '#4a7a9a', dmg: 10 }, charger: { hp: 60, r: 12, spd: 55, c: '#9a5a3a', dmg: 16 }, boss: { hp: 420, r: 24, spd: 34, c: '#b8902a', dmg: 22 } };
function spawn(t) { const T = TY[t], s = 1 + (room - 1) * .15; foes.push({ t, x: R(60, W - 60), y: R(50, H / 2), hp: T.hp * s, max: T.hp * s, r: T.r, spd: T.spd, c: T.c, dmg: T.dmg, st: 'walk', st_t: R(.5, 1.5), kx: 0, ky: 0, hit: 0, stag: 0 }); }

// ---------- 主角操作 ----------
const COMBO = [{ arc: 1.6, rng: 42, dmg: 14, t: .22 }, { arc: 1.6, rng: 44, dmg: 16, t: .22 }, { arc: 2.4, rng: 52, dmg: 28, t: .34, kb: 1 }];
function aim() { if (!touch && mouse.on) { const dx = mouse.x - hero.x, dy = mouse.y - hero.y, l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; } return [hero.fx, hero.fy]; }
function atk() { if (state !== 'fight' || hero.cd > 0 || hero.dashT > 0) return; if (hero.comboT <= 0) hero.combo = 0; const C = COMBO[hero.combo], [ax, ay] = aim(); hero.fx = ax; hero.fy = ay;
  hero.swing = { a: Math.atan2(ay, ax), C, t: 0 }; hero.cd = C.t; hero.comboT = C.t + .35; hero.x += ax * 6; hero.y += ay * 6;
  let hitAny = 0; for (const f of foes) { const dx = f.x - hero.x, dy = f.y - hero.y, d = Math.hypot(dx, dy); let da = Math.abs(Math.atan2(dy, dx) - hero.swing.a); if (da > Math.PI) da = 2 * Math.PI - da;
    if (d < C.rng * (boons.reach ? 1.25 : 1) + f.r && da < C.arc / 2) { hurt(f, C.dmg * (boons.str ? 1.3 : 1), ax, ay, C.kb ? 14 : 5); hitAny = 1; if (boons.chain) chain(f); } }
  if (hitAny) { stopT = hero.combo === 2 ? .09 : .05; shake = Math.max(shake, hero.combo === 2 ? 5 : 2); }
  hero.combo = (hero.combo + 1) % 3; }
function dash() { if (state !== 'fight' || hero.dashCd > 0) return; const m = moveV(); const [dx, dy] = m[0] || m[1] ? m : [hero.fx, hero.fy]; hero.dvx = dx; hero.dvy = dy; hero.dashT = .16; hero.inv = .25; hero.dashCd = boons.dash2 ? .35 : .7; hero.cd = 0;
  for (let i = 0; i < 4; i++) fx.push({ k: 'ghost', x: hero.x, y: hero.y, t: 0, d: i * .03 }); if (boons.dashfire) fx.push({ k: 'trail', x: hero.x, y: hero.y, vx: dx, vy: dy, t: 0 }); }
function heavyOn() { if (state === 'fight' && hero.cd <= 0) hero.heavy = .001; }
function heavyOff() { if (!hero.heavy) return; const k = Math.min(1, hero.heavy / .8); hero.heavy = 0; const [ax, ay] = aim(), r = 50 + 40 * k;
  fx.push({ k: 'ring', x: hero.x + ax * 20, y: hero.y + ay * 20, r, t: 0, c: '#ffd77a' }); hero.cd = .45; let h = 0;
  for (const f of foes) if (D(f, { x: hero.x + ax * 20, y: hero.y + ay * 20 }) < r + f.r) { hurt(f, 20 + 40 * k, (f.x - hero.x) / (D(f, hero) || 1), (f.y - hero.y) / (D(f, hero) || 1), 10 + 14 * k); f.stag = .5 + k; h = 1; }
  if (h) { stopT = .08 + .06 * k; shake = 6 + 6 * k; } }
function chain(f0) { const o = foes.filter(f => f !== f0 && D(f, f0) < 120).sort((a, b) => D(a, f0) - D(b, f0))[0]; if (o) { fx.push({ k: 'bolt', a: { x: f0.x, y: f0.y }, b: { x: o.x, y: o.y }, t: 0 }); hurt(o, 8, 0, 0, 0); } }
function hurt(f, dmg, ax, ay, kb) { const cr = boons.crit && Math.random() < .2; if (cr) dmg *= 2; f.hp -= dmg; f.hit = .12; f.kx += ax * kb * 10; f.ky += ay * kb * 10; nums.push({ x: f.x, y: f.y - f.r, v: Math.round(dmg), t: 0, c: cr ? '#ff6' : '#fff' });
  if (f.st === 'wind' && kb >= 10 && f.t !== 'boss') { f.st = 'walk'; f.st_t = 1; nums.push({ x: f.x, y: f.y - f.r - 12, v: '打断!', t: 0, c: '#7cf' }); } }
function hitHero(d) { if (hero.inv > 0) return; hero.hp -= d; hero.inv = .6; shake = 6; flash = .15; nums.push({ x: hero.x, y: hero.y - 16, v: '-' + d, t: 0, c: '#f55' }); if (hero.hp <= 0) state = 'dead'; }

// ---------- 自动技能（祝福）----------
const BOON = { orbit: ['旋刃', '两把刀自动绕身旋转'], bolt: ['落雷', '每 2 秒劈最近的敌人'], nova: ['寒霜新星', '每 5 秒冻住周围敌人'], chain: ['连锁闪电', '普攻命中弹到旁边一只'], dashfire: ['烈焰冲刺', '冲刺路径留下火焰'], str: ['蛮力', '普攻伤害 +30%'], reach: ['长臂', '普攻范围 +25%'], crit: ['会心', '20% 双倍伤害'], dash2: ['疾风', '冲刺冷却减半'], heal: ['生命泉', '回复 40 生命'] };
let bt = { bolt: 0, nova: 0 }, orbA = 0;
function autoSkills(dt) {
  if (boons.orbit) { orbA += dt * 5; for (let i = 0; i < 2; i++) { const a = orbA + i * Math.PI, p = { x: hero.x + Math.cos(a) * 34, y: hero.y + Math.sin(a) * 34 }; for (const f of foes) if (D(f, p) < f.r + 8 && !(f.orbT > 0)) { hurt(f, 6, 0, 0, 2); f.orbT = .35; } } }
  if (boons.bolt && (bt.bolt -= dt) <= 0) { const f = foes.slice().sort((a, b) => D(a, hero) - D(b, hero))[0]; if (f) { bt.bolt = 2; fx.push({ k: 'sky', x: f.x, y: f.y, t: 0 }); hurt(f, 22, 0, 0, 0); stopT = Math.max(stopT, .03); } }
  if (boons.nova && (bt.nova -= dt) <= 0) { bt.nova = 5; fx.push({ k: 'ring', x: hero.x, y: hero.y, r: 90, t: 0, c: '#8df' }); for (const f of foes) if (D(f, hero) < 90 + f.r) { f.frz = 1.5; hurt(f, 10, 0, 0, 0); } }
}
function showPick() { state = 'pick'; const keys = Object.keys(BOON).filter(k => !boons[k] || k === 'heal').sort(() => Math.random() - .5).slice(0, 3), el = document.getElementById('pick'); el.innerHTML = '';
  for (const k of keys) { const d = document.createElement('div'); d.innerHTML = `<b>${BOON[k][0]}</b>${BOON[k][1]}`; d.onclick = () => { if (k === 'heal') hero.hp = Math.min(hero.max, hero.hp + 40); else boons[k] = 1; el.style.display = 'none'; nextRoom(); }; el.appendChild(d); } el.style.display = 'flex'; }

// ---------- 敌人 AI：走近 → 前摇（红色提示）→ 出招 → 硬直 ----------
function foeAI(f, dt) {
  if (f.frz > 0) { f.frz -= dt; return; } if (f.stag > 0) { f.stag -= dt; return; } f.st_t -= dt; const dx = hero.x - f.x, dy = hero.y - f.y, d = Math.hypot(dx, dy) || 1;
  if (f.st === 'walk') { const want = f.t === 'archer' ? 170 : 30; const s = d > want ? 1 : f.t === 'archer' ? -1 : 0; f.x += dx / d * f.spd * s * dt; f.y += dy / d * f.spd * s * dt;
    if (f.st_t <= 0 && (f.t === 'archer' || f.t === 'charger' || d < 70 || f.t === 'boss')) { f.st = 'wind'; f.st_t = f.t === 'boss' ? .9 : f.t === 'brute' ? .7 : .6; f.ax = dx / d; f.ay = dy / d; f.tx = hero.x; f.ty = hero.y; f.mv = f.t === 'boss' ? (Math.random() < .5 ? 'slam' : 'spin') : ''; } }
  else if (f.st === 'wind') { if (f.st_t <= 0) { f.st = 'act'; f.st_t = f.t === 'charger' ? .45 : .15; doAct(f); } }
  else if (f.st === 'act') { if (f.t === 'charger') { f.x += f.ax * 300 * dt; f.y += f.ay * 300 * dt; if (D(f, hero) < f.r + 10) hitHero(f.dmg); } if (f.st_t <= 0) { f.st = 'rec'; f.st_t = f.t === 'boss' ? .8 : .9; } }
  else if (f.st === 'rec' && f.st_t <= 0) { f.st = 'walk'; f.st_t = R(1, 2.2); } }
function doAct(f) {
  if (f.t === 'brute') { const p = { x: f.x + f.ax * 34, y: f.y + f.ay * 34 }; fx.push({ k: 'ring', x: p.x, y: p.y, r: 38, t: 0, c: '#f84' }); shake = Math.max(shake, 4); if (D(p, hero) < 40) hitHero(f.dmg); }
  if (f.t === 'archer') shots.push({ x: f.x, y: f.y, vx: f.ax * 230, vy: f.ay * 230, dmg: f.dmg, t: 0 });
  if (f.t === 'boss') { if (f.mv === 'slam') { fx.push({ k: 'ring', x: f.tx, y: f.ty, r: 60, t: 0, c: '#f84' }); shake = 9; if (D({ x: f.tx, y: f.ty }, hero) < 62) hitHero(f.dmg); }
    else for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; shots.push({ x: f.x, y: f.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, dmg: 12, t: 0 }); } } }
function drawWarn(f) { if (f.st !== 'wind') return; const k = 1 - f.st_t / (f.t === 'boss' ? .9 : .7); g.globalAlpha = .25 + .35 * k; g.fillStyle = '#f33'; g.strokeStyle = '#f33';
  if (f.t === 'brute') { g.beginPath(); g.arc(f.x + f.ax * 34, f.y + f.ay * 34, 38 * k, 0, 7); g.fill(); g.beginPath(); g.arc(f.x + f.ax * 34, f.y + f.ay * 34, 38, 0, 7); g.stroke(); }
  if (f.t === 'archer' || f.t === 'charger') { g.lineWidth = f.t === 'charger' ? f.r * 2 * k : 2; g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(f.x + f.ax * 400, f.y + f.ay * 400); g.stroke(); g.lineWidth = 1; }
  if (f.t === 'boss') { if (f.mv === 'slam') { g.beginPath(); g.arc(f.tx, f.ty, 60 * k, 0, 7); g.fill(); g.beginPath(); g.arc(f.tx, f.ty, 60, 0, 7); g.stroke(); } else { g.beginPath(); g.arc(f.x, f.y, f.r + 20 * k, 0, 7); g.stroke(); } }
  g.globalAlpha = 1; }
function moveV() { let x = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0), y = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0); if (joy) { const l = Math.hypot(joy.dx, joy.dy); if (l > 8) { x = joy.dx / l; y = joy.dy / l; } } const l = Math.hypot(x, y); return l ? [x / l, y / l] : [0, 0]; }

// ---------- 主循环 ----------
let last = 0; reset();
function loop(n) { let dt = Math.min(.033, (n - last) / 1000 || 0); last = n; requestAnimationFrame(loop);
  if (state === 'fight') { if (stopT > 0) { stopT -= dt; dt = 0; } step(dt); } draw(); }
function step(dt) { if (!dt) return; const h = hero; h.cd -= dt; h.comboT -= dt; h.dashCd -= dt; h.inv -= dt; if (h.heavy) h.heavy += dt;
  if (h.dashT > 0) { h.dashT -= dt; h.x += h.dvx * 520 * dt; h.y += h.dvy * 520 * dt; }
  else { const [mx, my] = moveV(), sp = h.heavy ? 50 : h.swing && h.swing.t < .15 ? 40 : 130; h.x += mx * sp * dt; h.y += my * sp * dt; if (mx || my) { h.fx = mx; h.fy = my; } }
  h.x = Math.max(14, Math.min(W - 14, h.x)); h.y = Math.max(14, Math.min(H - 14, h.y)); if (h.swing) { h.swing.t += dt; if (h.swing.t > .18) h.swing = null; }
  for (const f of foes) { foeAI(f, dt); f.x += f.kx * dt; f.y += f.ky * dt; f.kx *= .82; f.ky *= .82; f.hit -= dt; f.orbT -= dt; f.x = Math.max(f.r, Math.min(W - f.r, f.x)); f.y = Math.max(f.r, Math.min(H - f.r, f.y)); }
  for (const f of foes) if (f.hp <= 0) { h.kills++; for (let i = 0; i < 10; i++) fx.push({ k: 'bit', x: f.x, y: f.y, vx: R(-120, 120), vy: R(-160, 40), t: 0, c: f.c }); stopT = Math.max(stopT, .06); }
  foes = foes.filter(f => f.hp > 0);
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; s.t += dt; if (D(s, h) < 10) { hitHero(s.dmg); s.t = 9; } } shots = shots.filter(s => s.t < 3 && s.x > -20 && s.x < W + 20 && s.y > -20 && s.y < H + 20);
  autoSkills(dt);
  for (const e of fx) { e.t += dt; if (e.k === 'bit') { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 400 * dt; } if (e.k === 'trail' && e.t < .16) fx.push({ k: 'fire', x: h.x, y: h.y, t: 0 }); if (e.k === 'fire') for (const f of foes) if (D(f, e) < 14 + f.r && !(f.fireT > e.t)) { hurt(f, 3, 0, 0, 0); f.fireT = e.t + .3; } }
  fx = fx.filter(e => e.t < (e.k === 'fire' ? 2 : e.k === 'bit' ? .6 : .35)); for (const m of nums) m.t += dt; nums = nums.filter(m => m.t < .7); shake *= .85; flash -= dt;
  if (!foes.length) { state = 'clear'; setTimeout(showPick, 700); } }
const BG = Object.assign(new Image(), { src: 'art/map/forest.webp' }); let T = 0;
// 有这一帧就用，没有就退回 idle0 / 第一帧
function fr(set, names) { const S = SPR.sets[set]; if (!S || !S.f) return null; for (const n of names) if (S.f[n]) return n; return S.f.idle0 ? 'idle0' : Object.keys(S.f)[0]; }
function anim(set, base, n, sp) { const S = SPR.sets[set]; if (!S || !S.f) return null; let c = 0; while (S.f[base + c]) c++; return c ? base + (Math.floor(T * sp) % c) : fr(set, [base, 'idle0']); }
function draw() { T = performance.now() / 1000; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#2b2a33'; g.fillRect(0, 0, W, H); g.translate(R(-shake, shake), R(-shake, shake));
  if (BG.complete && BG.naturalWidth) { g.imageSmoothingEnabled = false; g.drawImage(BG, 0, 0, W, H); } else { g.strokeStyle = '#34333d'; for (let x = 0; x < W; x += 32) for (let y = 0; y < H; y += 32) g.strokeRect(x, y, 32, 32); }
  for (const e of fx) if (e.k === 'fire') { g.fillStyle = `rgba(255,${120 + Math.random() * 80 | 0},40,${.5 * (1 - e.t / 2)})`; g.beginPath(); g.arc(e.x, e.y, 10, 0, 7); g.fill(); }
  for (const f of foes) drawWarn(f);
  for (const f of foes) { const st = SET[f.t], u = f.t === 'boss' ? 2.6 : 2, nm = f.st === 'wind' || f.st === 'act' ? anim(st, 'atk', 0, 0) && fr(st, f.st === 'wind' ? ['atk0', 'wind0'] : ['atk2', 'atk1', 'atk0']) : f.stag > 0 || f.hit > 0 ? fr(st, ['hit0', 'hurt0']) : anim(st, 'walk', 0, 9);
    if (nm && SPR.sets[st]) SPR.draw(g, st, nm, 0, f.x, f.y + f.r * .6, hero.x < f.x, u, { white: f.hit > 0 ? .7 : f.st === 'wind' && (T * 12 | 0) % 2 ? .25 : 0 });
    else { g.fillStyle = f.hit > 0 ? '#fff' : f.c; g.beginPath(); g.arc(f.x, f.y, f.r, 0, 7); g.fill(); }
    if (f.frz > 0) { g.fillStyle = 'rgba(140,200,255,.45)'; g.beginPath(); g.arc(f.x, f.y, f.r + 4, 0, 7); g.fill(); } if (f.st === 'rec') { g.fillStyle = '#ff0'; g.fillText('…', f.x - 4, f.y - f.r - 4); }
    g.fillStyle = '#000'; g.fillRect(f.x - f.r, f.y - f.r - 8, f.r * 2, 4); g.fillStyle = '#e44'; g.fillRect(f.x - f.r, f.y - f.r - 8, f.r * 2 * f.hp / f.max, 4); }
  for (const s of shots) { g.fillStyle = '#fc6'; g.beginPath(); g.arc(s.x, s.y, 4, 0, 7); g.fill(); }
  const h = hero; for (const e of fx) if (e.k === 'ghost') { g.globalAlpha = .3 * (1 - e.t / .35); g.fillStyle = '#8cf'; g.beginPath(); g.arc(e.x, e.y, 10, 0, 7); g.fill(); g.globalAlpha = 1; }
  if (h.heavy) { const k = Math.min(1, h.heavy / .8); g.strokeStyle = k >= 1 ? '#fff' : '#ffd77a'; g.beginPath(); g.arc(h.x, h.y, 16 + 10 * k, 0, 7 * k); g.stroke(); }
