<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿远七武器动作对比</title><style>body{margin:0;background:#e9dfc1;color:#38281d;font:16px sans-serif;text-align:center}button,select{font:inherit;margin:6px;padding:8px}canvas{display:block;margin:auto;max-width:100%;image-rendering:pixelated}#frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px} @media(max-width:650px){#frames{grid-template-columns:1fr}}#frames canvas{margin:4px}</style><h2>阿远七武器动作对比</h2><select id="weapon"></select><select id="action"></select><button id="pause">暂停</button><p id="status">载入中</p><canvas id="cv" width="700" height="260"></canvas><p>下方逐帧查看：新版33帧，蓝灰底检查透明区域</p><p id="variants"></p><div id="frames"></div><script>
const statusEl=document.getElementById('status');
const names={sword:'剑',spear:'枪',bow:'弓',staff:'法杖',gun:'掌机',tome:'圣典',scythe:'镰刀'},cache={};let current,paused=false,t=0;
const load=async dir=>{if(cache[dir])return cache[dir];const [j,im]=await Promise.all([fetch('../art/'+dir+'/atlas.json').then(r=>r.json()),new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src='../art/'+dir+'/atlas.png'})]);return cache[dir]={j:j.f,im}};
function draw(g,set,key,i,x,y,u){const arr=set.j['hero:'+key];if(!arr)return;const [sx,sy,w,h,ax,ay]=arr[i%arr.length];g.imageSmoothingEnabled=false;g.drawImage(set.im,sx,sy,w,h,x-ax*u,y-ay*u,w*u,h*u)}
async function choose(){const w=weapon.value;statusEl.textContent='载入中';const newer=await load('hero'+w[0].toUpperCase()+w.slice(1)+'Preview');const older=await load(['tome','scythe'].includes(w)?'heroM2':w==='gun'?'heroHandheldPreview':'hero');const versions=[['原版',older],['新版1',newer]];if(w==='scythe')for(const v of [2,3,4])versions.push(['新版'+v,await load('heroScythePreview'+v)]);current={w,newer,older,versions};action.innerHTML='';for(const k of Object.keys(newer.j))action.add(new Option(k.split('.')[1],k.split('.')[1]));statusEl.textContent=names[w]+'：各版同步动作，下方同屏12帧';renderFrames();}
let framePage=0;
function renderFrames(){if(!current)return;const{w,newer,versions}=current;const list=Object.entries(newer.j).flatMap(([k,a])=>a.map((_,i)=>[k,i]));frames.innerHTML='';variants.innerHTML='';for(let p=0;p<3;p++){const b=document.createElement('button');b.textContent='第'+(p*12+1)+'～'+Math.min(33,p*12+12)+'帧';b.onclick=()=>{framePage=p;renderFrames()};variants.append(b)}for(const[k,i]of list.slice(framePage*12,framePage*12+12)){const c=document.createElement('canvas');c.width=versions.length*140;c.height=190;c.style.width='min(100%, '+c.width+'px)';const g=c.getContext('2d');g.fillStyle='#597c80';g.fillRect(0,0,c.width,c.height);versions.forEach(([label,set],j)=>{g.fillStyle='white';g.font='12px sans-serif';g.fillText(label+' '+k.split('.')[1]+i,j*140+4,15);draw(g,set,k.slice(5),i,j*140+70,175,2)});frames.append(c)}}
for(const[w,n]of Object.entries(names))weapon.add(new Option(n,w));weapon.onchange=choose;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'播放':'暂停'};
function tick(){requestAnimationFrame(tick);if(!current)return;if(!paused)t+=1/60;const{w,versions}=current;cv.width=versions.length*180;const g=cv.getContext('2d');g.fillStyle='#e9dfc1';g.fillRect(0,0,cv.width,260);versions.forEach(([label,set],j)=>{draw(g,set,w+'.'+action.value,Math.floor(t*6),j*180+90,210,2);g.fillStyle='#38281d';g.font='16px sans-serif';g.fillText(label,j*180+55,245)})}weapon.value=new URLSearchParams(location.search).get('w')||'sword';choose().catch(e=>statusEl.textContent=e.message);tick();
</script></html>
