<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿远七武器动作对比</title><style>body{margin:0;background:#e9dfc1;color:#38281d;font:16px sans-serif;text-align:center}button,select{font:inherit;margin:6px;padding:8px}canvas{display:block;margin:auto;max-width:100%;image-rendering:pixelated}#frames{display:flex;flex-wrap:wrap;justify-content:center}#frames canvas{margin:4px}</style><h2>阿远七武器动作对比</h2><select id="weapon"></select><select id="action"></select><button id="pause">暂停</button><p id="status">载入中</p><canvas id="cv" width="700" height="260"></canvas><p>下方逐帧查看：新版33帧，蓝灰底检查透明区域</p><div id="frames"></div><script>
const statusEl=document.getElementById('status');
const names={sword:'剑',spear:'枪',bow:'弓',staff:'法杖',gun:'掌机',tome:'圣典',scythe:'镰刀'},cache={};let current,paused=false,t=0;
const load=async dir=>{if(cache[dir])return cache[dir];const [j,im]=await Promise.all([fetch('../art/'+dir+'/atlas.json').then(r=>r.json()),new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src='../art/'+dir+'/atlas.png'})]);return cache[dir]={j:j.f,im}};
function draw(g,set,key,i,x,y,u){const arr=set.j['hero:'+key];if(!arr)return;const [sx,sy,w,h,ax,ay]=arr[i%arr.length];g.imageSmoothingEnabled=false;g.drawImage(set.im,sx,sy,w,h,x-ax*u,y-ay*u,w*u,h*u)}
async function choose(){const w=weapon.value;statusEl.textContent='载入中';const newer=await load('hero'+w[0].toUpperCase()+w.slice(1)+'Preview');const older=await load(['tome','scythe'].includes(w)?'heroM2':w==='gun'?'heroHandheldPreview':'hero');current={w,newer,older};action.innerHTML='';for(const k of Object.keys(newer.j)){const o=new Option(k.split('.')[1],k.split('.')[1]);action.add(o)}statusEl.textContent=names[w]+'：左为原有版本，右为本次新版';frames.innerHTML='';for(const [k,arr]of Object.entries(newer.j))arr.forEach((_,i)=>{const c=document.createElement('canvas');c.width=180;c.height=180;const g=c.getContext('2d');g.fillStyle='#597c80';g.fillRect(0,0,180,180);g.fillStyle='white';g.font='12px sans-serif';g.fillText(k.split('.')[1]+i,5,15);draw(g,newer,k.slice(5),i,90,165,3);frames.append(c)});}
for(const[w,n]of Object.entries(names))weapon.add(new Option(n,w));weapon.onchange=choose;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'播放':'暂停'};
function tick(){requestAnimationFrame(tick);if(!current)return;if(!paused)t+=1/60;const{w,newer,older}=current,g=cv.getContext('2d');g.fillStyle='#e9dfc1';g.fillRect(0,0,700,260);const n=action.value,i=Math.floor(t*6);draw(g,older,w+'.'+n,i,220,210,3);draw(g,newer,w+'.'+n,i,480,210,3);g.fillStyle='#38281d';g.font='18px sans-serif';g.fillText('原有版本',180,245);g.fillText('新版',460,245)}choose().catch(e=>statusEl.textContent=e.message);tick();
</script></html>
