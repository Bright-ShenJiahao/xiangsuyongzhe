const inR = (x, y, r) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3], okW = (x, y) => { const X = x / S1, Y = y / S1; return WALKR.some(r => inR(X, Y, r)) && !BLK.some(r => inR(X, Y, r)); };
let LAY = null; function mkLay() { LAY = OCC.map(o => { const l = document.createElement('canvas'); l.width = CW; l.height = CH; const q = l.getContext('2d'); q.imageSmoothingEnabled = false; q.beginPath(); o.p.forEach(([x, y], i) => i ? q.lineTo(x * S1, y * S1) : q.moveTo(x * S1, y * S1)); q.closePath(); q.clip(); q.drawImage(BG, 0, 0, CW, CH); const xs = o.p.map(p => p[0] * S1), ys = o.p.map(p => p[1] * S1); return { l, x1: Math.min(...xs), x2: Math.max(...xs), y1: Math.min(...ys), y2: Math.max(...ys), base: o.base * S1 }; }); }
const SPOTS = [{ id: 'diary', t: (X, Y) => Math.abs(X - 836) < 50 && Y > 186 && Y < 210 }, { id: 'tree', t: (X, Y) => Y > 660 && Y < 705 && (Math.abs(X - 185) < 60 || Math.abs(X - 1487) < 60) }, { id: 'rail', t: (X, Y) => Y >= 752 && X > 300 && X < 1370 }];
function eggSay(s) { const b = $('bub'), c = $('pc').getBoundingClientRect(); b.textContent = s; b.style.left = c.left + walk.x / CW * c.width + 'px'; b.style.top = c.top + (walk.y - 52) / CH * c.height + 'px'; b.style.display = 'block'; clearTimeout(bumpSay.tm); bumpSay.tm = setTimeout(() => b.style.display = 'none', 3800); }
function eggStep(dt) { walk.ring = null; if (walk.mv) { walk.sp = null; walk.sp0 = 0; return; } const X = walk.x / S1, Y = walk.y / S1, sp = SPOTS.find(o => !EGG.has(o.id) && o.t(X, Y)); if (!sp) { walk.sp = null; walk.sp0 = 0; return; } if (walk.sp !== sp.id) { walk.sp = sp.id; walk.sp0 = 0; } walk.sp0 += dt / 2; walk.ring = { x: walk.x, y: walk.y + 2, p: Math.min(1, walk.sp0) }; if (walk.sp0 >= 1) { const e = EGG.find(sp.id); walk.sp0 = 0; if (e) eggSay(e.say); } }
function stepWalk() { const n = performance.now(), dt = Math.min(.05, (n - (wLast || n)) / 1000); wLast = n; let dx = (KEY.KeyD || KEY.ArrowRight ? 1 : 0) - (KEY.KeyA || KEY.ArrowLeft ? 1 : 0), dy = (KEY.KeyS || KEY.ArrowDown ? 1 : 0) - (KEY.KeyW || KEY.ArrowUp ? 1 : 0);
  if (touchP) { const c = $('pc').getBoundingClientRect(), tx = (touchP.clientX - c.left) / c.width * CW, ty = (touchP.clientY - c.top) / c.height * CH; dx = tx - walk.x; dy = ty - walk.y; }
  const l = Math.hypot(dx, dy); walk.mv = l > (touchP ? 2 : 0); if (Math.abs(dx) > .5) walk.f = dx < 0 ? -1 : 1; if (walk.mv && (walk.st = (walk.st || 0) - dt) <= 0) { walk.st = .3; FS('step'); } if (walk.mv) { const nx = walk.x + dx / l * 110 * dt, ny = walk.y + dy / l * 110 * dt; let o = hitNPC(nx, walk.y); if (!o) { if (okW(nx, walk.y)) walk.x = nx; } else bumpSay(o); o = hitNPC(walk.x, ny); if (!o) { if (okW(walk.x, ny)) walk.y = ny; } else bumpSay(o); }
  if (window.EGG && GAME) eggStep(dt); tpStep(dt);
  walk.x = Math.max(95 * S1, Math.min(1580 * S1, walk.x)); walk.y = Math.max(138 * S1, Math.min(770 * S1, walk.y));   /* 11/25 夹边跟 WALKR 一致（旧夹边把祭台一带挡在外面） */
  if (!QS.has('visit') && Math.hypot(walk.x - 835 * CW / 1672, (walk.y - 735 * CW / 1672) * 1.4) < 18 && !walk.done) { walk.done = 1; FS('whoosh'); $('cap').textContent = ''; $('white').style.transition = 'opacity .5s'; $('white').style.opacity = 1; setTimeout(done, 550); } }
