<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素勇者 · 开场演示</title>
<style>
@font-face { font-family: WenKai; src: url(../art/font/kai.woff2?v=2); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: WenKai, serif; }
#st { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.pg { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; overflow: hidden; }
.pg.on { opacity: 1; }
.pg img.ill { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.7vh); transform: translate(-50%, -50%) scale(1.04); filter: sepia(.15); }
.frame { position: absolute; inset: 0; background: url(../art/intro/frame.webp) center / 100% 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .95; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(30, 16, 6, .75) 100%); pointer-events: none; }
#cap { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); width: min(900px, 86vw); text-align: center; color: #fff3d8; font-size: clamp(17px, 2.4vw, 26px); line-height: 1.8; letter-spacing: .08em; text-shadow: 0 2px 6px #000, 0 0 14px rgba(0,0,0,.8); min-height: 3.6em; z-index: 5; }
#white { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
#px { position: fixed; inset: 0; opacity: 0; z-index: 6; } #px canvas { width: 100%; height: 100%; image-rendering: pixelated; }
#dlg { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); width: min(760px, 92vw); display: none; gap: 14px; align-items: flex-start; background: #2a1e14; border: 4px solid #c89a52; box-shadow: 0 0 0 4px #1a0e06; padding: 12px 16px; color: #f4ecd8; font-size: clamp(16px, 2vw, 20px); z-index: 7; }
#dlg img { width: 72px; height: 72px; object-fit: cover; object-position: top; border: 2px solid #c89a52; background: #3a2a1a; } #dlg b { color: #ffd890; display: block; margin-bottom: 4px; }
#skip, #play { position: fixed; z-index: 10; font: 15px WenKai, serif; color: #f4ecd8; background: rgba(20,12,6,.7); border: 2px solid #c89a52; padding: 4px 14px; cursor: pointer; }
#skip { right: 16px; top: 14px; } #play { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; padding: 10px 26px; }
.crack { position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none; }
</style></head><body>
<div id="st">
  <div class="pg" id="g1"><img class="ill" src="../art/intro/p1.webp"><div class="vig"></div><div class="frame"></div></div>
  <div class="pg" id="g2"><img class="ill" src="../art/intro/p2.webp"><canvas class="crack" id="ck"></canvas><div class="vig"></div><div class="frame"></div></div>
  <div class="pg" id="g3"><img class="ill" src="../art/intro/p3.webp"><canvas class="crack" id="cr"></canvas><div class="vig"></div><div class="frame"></div></div>
</div>
<div id="cap"></div><div id="white"></div>
<div id="px"><canvas id="pc" width="320" height="180"></canvas></div>
<div id="dlg"><img id="dav"><div><b id="dn"></b><span id="dt"></span></div></div>
<button id="skip">跳过 ▶▶</button><button id="play">▶ 播放开场</button>
<script>
const $ = s => document.getElementById(s), wait = ms => new Promise(r => setTimeout(r, ms));
let RUN = 0;
async function type(el, s, id, sp = 70) { el.textContent = ''; for (let i = 1; i <= s.length; i++) { if (id !== RUN) return; el.textContent = s.slice(0, i); await wait(sp); } }
function kb(img, from, to, T) { img.animate([{ transform: `translate(-50%,-50%) ${from}` }, { transform: `translate(-50%,-50%) ${to}` }], { duration: T, easing: 'linear', fill: 'forwards' }); }
// 第 2 页：裂缝里一闪一闪往下掉方块；第 3 页：水晶光呼吸
function fx(cvId, mode) { const c = $(cvId), g = c.getContext('2d'); let bits = []; function f(t) { if (!c.isConnected) return; const W = c.width = c.clientWidth / 3 | 0, H = c.height = c.clientHeight / 3 | 0; g.clearRect(0, 0, W, H);
  if (mode === 'crack') { if (Math.random() < .5) bits.push({ x: W * (.32 + Math.random() * .45), y: H * (.08 + Math.random() * .15), v: .3 + Math.random() * .6 }); for (const b of bits) { b.y += b.v; g.fillStyle = `rgba(255,190,90,${Math.max(0, 1 - b.y / (H * .6))})`; g.fillRect(b.x | 0, b.y | 0, 2, 2); } bits = bits.filter(b => b.y < H * .6);
    g.fillStyle = `rgba(255,170,70,${.08 + .06 * Math.sin(t / 120)})`; g.fillRect(W * .3, 0, W * .5, H * .3); }
  else { const x = W * .455, y = H * .25, r = 14 + 4 * Math.sin(t / 400); const gr = g.createRadialGradient(x, y, 0, x, y, r * 2.5); gr.addColorStop(0, 'rgba(200,170,255,.55)'); gr.addColorStop(1, 'rgba(160,140,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  requestAnimationFrame(f); } requestAnimationFrame(f); }
fx('ck', 'crack'); fx('cr', 'glow');
// 像素场景
const AT = Object.assign(new Image(), { src: '../art/hero/atlas.png' }), PR = Object.assign(new Image(), { src: '../art/heroP/atlas.png' }), BG = Object.assign(new Image(), { src: '../art/map/forest3.webp' });
const FR = { idle: [0, 0, 36, 40, 13.6, 39], hurt: [442, 0, 45, 39, 18.5, 39], dead: [489, 0, 54, 23, 19.7, 23] }, PI = [[878, 140, 38, 40, 16.5, 40], [918, 140, 39, 40, 17.4, 40]];
let pxState = 'off', pxT0 = 0;
function pxDraw(n) { const g = $('pc').getContext('2d'); g.imageSmoothingEnabled = false; const t = (n - pxT0) / 1000;
  if (BG.complete) g.drawImage(BG, -460, -60, 1100, 619); g.fillStyle = 'rgba(10,8,40,.35)'; g.fillRect(0, 0, 320, 180);
  // 石祭坛
  const ax = 150, ay = 118; const st = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  st(ax - 44, ay + 6, 88, 8, '#1e1a24'); st(ax - 44, ay + 6, 88, 2, '#5a5464');                       // 台阶
  st(ax - 38, ay - 2, 76, 9, '#2a2532'); st(ax - 38, ay - 2, 76, 2, '#6a6474');
  st(ax - 32, ay - 12, 64, 11, '#3c3646'); st(ax - 32, ay - 13, 64, 3, '#8a8494'); st(ax - 32, ay - 13, 64, 1, '#b0aab8');   // 台面
  for (let i = 0; i < 4; i++) st(ax - 26 + i * 15, ay - 9, 8, 7, '#2a2532');                       // 正面雕花格
  st(ax - 2, ay - 9, 4, 7, `rgba(190,170,255,${.5 + .3 * Math.sin(t * 2)})`);
  const glow = Math.max(0, 1 - t / 2.5); if (glow > 0) { const gr = g.createRadialGradient(ax, ay - 14, 0, ax, ay - 14, 60); gr.addColorStop(0, `rgba(210,190,255,${.7 * glow})`); gr.addColorStop(1, 'rgba(160,140,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 320, 180); }
  // 勇者：躺 → 撑起 → 站
  const fr = t < 2.2 ? FR.dead : t < 2.8 ? FR.hurt : FR.idle; if (AT.complete) g.drawImage(AT, fr[0], fr[1], fr[2], fr[3], ax - fr[4], ay - 12 - fr[5], fr[2], fr[3]);
  if (t > 2.8 && t < 3.6 && Math.floor(t * 6) % 2) { g.fillStyle = '#fff'; g.fillRect(ax + 8, ay - 58, 2, 5); g.fillRect(ax + 8, ay - 51, 2, 2); }
  // 公主
  const pf = PI[Math.floor(t * 2) % 2]; if (PR.complete) { g.save(); g.translate(ax + 58, 0); g.scale(-1, 1); g.drawImage(PR, pf[0], pf[1], pf[2], pf[3], -pf[4], ay - pf[5] + 2, pf[2], pf[3]); g.restore(); }
  g.fillStyle = `rgba(220,240,255,${.5 + .3 * Math.sin(t * 3)})`; g.fillRect(ax + 50, ay - 24, 3, 3);
  if (pxState === 'on') requestAnimationFrame(pxDraw); }
async function say(id, who, av, s) { $('dlg').style.display = 'flex'; $('dn').textContent = who; $('dav').src = av; await type($('dt'), s, id, 55); await wait(1300); }
async function play() { const id = ++RUN; $('play').style.display = 'none'; reset();
  const P = [['g1', 'scale(1.04)', 'scale(1.14) translate(-2%, 1%)', ['卡带世界里，有一块和平的晨星大陆。', '每年星夜祭，王城的广场总是挤满了人。']],
             ['g2', 'scale(1.16) translate(2%, 2%)', 'scale(1.05)', ['直到有一天，这盘卡带被拿去违规烧录——', '别的游戏里的怪物，被硬塞了进来。', '哥布林占了森林，吸血鬼占了古城，兽人踏平了平原……']],
             ['g3', 'scale(1.06) translate(0, 3%)', 'scale(1.14) translate(0, -3%)', ['公主露米娜在最后的神殿里发出呼唤——', '呼唤顺着烧录的线路，传到了屏幕的另一边。']]];
  for (const [pg, a, b, lines] of P) { if (id !== RUN) return; const el = $(pg); el.classList.add('on'); kb(el.querySelector('.ill'), a, b, lines.length * 3200 + 1500); await wait(900);
    for (const l of lines) { if (id !== RUN) return; await type($('cap'), l, id); await wait(1500); } $('cap').textContent = ''; if (pg !== 'g3') { el.classList.remove('on'); await wait(700); } }
  if (id !== RUN) return; const w = $('white'); w.style.transition = 'opacity .8s'; w.style.opacity = 1; await wait(900); $('g3').classList.remove('on');
  $('px').style.opacity = 1; pxState = 'on'; pxT0 = performance.now(); requestAnimationFrame(pxDraw); w.style.transition = 'opacity 1.4s'; w.style.opacity = 0; await wait(3800);
  if (id !== RUN) return; await say(id, '勇者', '../art/portrait/m.webp', '这是……我刚买的那盘合卡里面？');
  if (id !== RUN) return; await say(id, '露米娜', '../art/portrait/p.webp', '您就是回应召唤的勇者吧！');
  if (id !== RUN) return; await say(id, '露米娜', '../art/portrait/p.webp', '裂缝还在扩大……请帮帮晨星大陆！');
  $('dlg').style.display = 'none'; $('cap').textContent = '（演示结束：这里接第一站教学）'; $('play').style.display = 'block'; $('play').textContent = '↺ 再看一次'; }
function reset() { pxState = 'off'; for (const e of document.querySelectorAll('.pg')) e.classList.remove('on'); $('px').style.opacity = 0; $('white').style.opacity = 0; $('dlg').style.display = 'none'; $('cap').textContent = ''; }
$('play').onclick = play; $('skip').onclick = () => { RUN++; reset(); $('cap').textContent = '（已跳过：直接进第一站）'; $('play').style.display = 'block'; $('play').textContent = '↺ 再看一次'; };
</script></body></html>
