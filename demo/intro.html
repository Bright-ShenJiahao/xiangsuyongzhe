<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素勇者 · 开场演示</title>
<style>
@font-face { font-family: WenKai; src: url(../art/font/kai.woff2?v=2); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: WenKai, serif; }
#st { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.pg { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; overflow: hidden; }
.pg.on { opacity: 1; }
.pg img.ill { position: absolute; left: 50%; top: 50%; width: max(100vw, 177.7vh); transform: translate(-50%, -50%) scale(1.04); filter: sepia(.15); }
.frame { position: absolute; inset: 0; background: url(../art/intro/frame.webp) center / 100% 100%; pointer-events: none; mix-blend-mode: multiply; opacity: .95; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(30, 16, 6, .75) 100%); pointer-events: none; }
#cap { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); width: min(900px, 86vw); text-align: center; color: #fff3d8; font-size: clamp(17px, 2.4vw, 26px); line-height: 1.8; letter-spacing: .08em; text-shadow: 0 2px 6px #000, 0 0 14px rgba(0,0,0,.8); min-height: 3.6em; z-index: 5; }
#white { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
#px { position: fixed; inset: 0; opacity: 0; z-index: 6; } #px canvas { width: 100%; height: 100%; image-rendering: pixelated; }
#dlg { position: fixed; left: 50%; bottom: 5vh; transform: translateX(-50%); width: min(760px, 92vw); display: none; gap: 14px; align-items: flex-start; background: #2a1e14; border: 4px solid #c89a52; box-shadow: 0 0 0 4px #1a0e06; padding: 12px 16px; color: #f4ecd8; font-size: clamp(16px, 2vw, 20px); z-index: 7; }
#dlg img { width: 72px; height: 72px; object-fit: cover; object-position: top; border: 2px solid #c89a52; background: #3a2a1a; } #dlg b { color: #ffd890; display: block; margin-bottom: 4px; }
#skip, #play { position: fixed; z-index: 10; font: 15px WenKai, serif; color: #f4ecd8; background: rgba(20,12,6,.7); border: 2px solid #c89a52; padding: 4px 14px; cursor: pointer; }
#skip { right: 16px; top: 14px; } #play { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 22px; padding: 10px 26px; }
.crack { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; pointer-events: none; }
#bub { position: fixed; z-index: 7; display: none; transform: translate(-50%, -100%); background: rgba(250,244,230,.96); border: 3px solid #3a2814; color: #3a2814; font-size: clamp(15px, 2vw, 22px); padding: 4px 12px; white-space: nowrap; }
#bub::after { content: ''; position: absolute; left: 50%; top: 100%; width: 10px; height: 8px; margin-left: -5px; background: #3a2814; }
</style></head><body>
<div id="st">
  <div class="pg" id="g1"><img class="ill" src="../art/intro/p1.webp"><div class="vig"></div><div class="frame"></div></div>
  <div class="pg" id="g2"><img class="ill" src="../art/intro/p2.webp"><canvas class="crack" id="ck"></canvas><div class="vig"></div><div class="frame"></div></div>
  <div class="pg" id="g2b"><img class="ill" src="../art/ui2/map.webp" style="filter:sepia(.75) brightness(.9) contrast(1.05)"><canvas class="crack" id="mk" style="mix-blend-mode:normal"></canvas><div class="vig"></div><div class="frame"></div></div>
  <div class="pg" id="g3"><img class="ill" src="../art/intro/p3.webp"><canvas class="crack" id="cr"></canvas><div class="vig"></div><div class="frame"></div></div>
</div>
<div id="cap"></div><div id="white"></div>
<div id="px"><canvas id="pc" width="640" height="360"></canvas></div>
<div id="bub"></div><div id="dlg"><img id="dav"><div><b id="dn"></b><span id="dt"></span></div></div>
<button id="skip">跳过 ▶▶</button><button id="play">▶ 播放开场</button>
<script>
const $ = s => document.getElementById(s), wait = ms => new Promise(r => setTimeout(r, ms));
let RUN = 0;
async function type(el, s, id, sp = 70) { el.textContent = ''; for (let i = 1; i <= s.length; i++) { if (id !== RUN) return; el.textContent = s.slice(0, i); await wait(sp); } }
function kb(img, from, to, T) { img.animate([{ transform: `translate(-50%,-50%) ${from}` }, { transform: `translate(-50%,-50%) ${to}` }], { duration: T, easing: 'linear', fill: 'forwards' }); }
// 第 2 页：裂缝里一闪一闪往下掉方块；第 3 页：水晶光呼吸
function fx(cvId, mode) { const c = $(cvId), g = c.getContext('2d'); let bits = []; function f(t) { if (!c.isConnected) return; const W = c.width = c.clientWidth / 3 | 0, H = c.height = c.clientHeight / 3 | 0; g.clearRect(0, 0, W, H);
  if (mode === 'crack') { if (Math.random() < .5) bits.push({ x: W * (.32 + Math.random() * .45), y: H * (.08 + Math.random() * .15), v: .3 + Math.random() * .6 }); for (const b of bits) { b.y += b.v; g.fillStyle = `rgba(255,190,90,${Math.max(0, 1 - b.y / (H * .6))})`; g.fillRect(b.x | 0, b.y | 0, 2, 2); } bits = bits.filter(b => b.y < H * .6);
    g.fillStyle = `rgba(255,170,70,${.08 + .06 * Math.sin(t / 120)})`; g.fillRect(W * .3, 0, W * .5, H * .3); }
  else { const x = W * .455, y = H * .25, r = 14 + 4 * Math.sin(t / 400); const gr = g.createRadialGradient(x, y, 0, x, y, r * 2.5); gr.addColorStop(0, 'rgba(200,170,255,.55)'); gr.addColorStop(1, 'rgba(160,140,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  requestAnimationFrame(f); } requestAnimationFrame(f); }
fx('ck', 'crack'); fx('cr', 'glow');
// 像素场景
const AT = Object.assign(new Image(), { src: '../art/hero/atlas.png' }), PR = Object.assign(new Image(), { src: '../art/heroP/atlas.png' }), BG = Object.assign(new Image(), { src: '../art/intro/tower.webp' });
const FR = { idle: [0, 0, 36, 40, 13.6, 39], hurt: [442, 0, 45, 39, 18.5, 39], dead: [489, 0, 54, 23, 19.7, 23] }, PI = [[878, 140, 38, 40, 16.5, 40], [918, 140, 39, 40, 17.4, 40]];
let pxState = 'off', pxT0 = 0;
function pxDraw(n) { const g = $('pc').getContext('2d'); g.imageSmoothingEnabled = false; const t = Math.max(0, (n - pxT0) / 1000), S = 640 / 1672;
  if (BG.complete) g.drawImage(BG, 0, 0, 640, 360);
  const ax = 835 * S, ay = 292 * S;   // 图里自带的祭坛正前方（平台前沿）
  // 召唤：光柱落下 → 勇者由像素方块拼出来 → 光散去
  const pil = t < 1.6 ? Math.min(1, t / .4) : Math.max(0, 1 - (t - 1.6) / .8); if (pil > 0) { const gr = g.createLinearGradient(0, 0, 0, ay); gr.addColorStop(0, 'rgba(220,200,255,0)'); gr.addColorStop(1, `rgba(230,215,255,${.85 * pil})`); g.fillStyle = gr; g.fillRect(ax - 14, 0, 28, ay + 2); g.fillStyle = `rgba(240,230,255,${.5 * pil})`; g.beginPath(); g.ellipse(ax, ay, 26, 7, 0, 0, 7); g.fill(); }
  const fr = FR.idle; if (AT.complete && t > .6) { const k = Math.min(1, (t - .6) / 1.2); const off = document.createElement('canvas'); off.width = fr[2]; off.height = fr[3]; const og = off.getContext('2d'); og.drawImage(AT, fr[0], fr[1], fr[2], fr[3], 0, 0, fr[2], fr[3]);
    for (let y = 0; y < fr[3]; y += 3) for (let x = 0; x < fr[2]; x += 3) { const d = 1 - Math.min(1, Math.max(0, (k * 2 - (fr[3] - y) / fr[3] * .4 - ((x * 7 + y * 13) % 10) / 25))); if (d >= 1) continue; g.globalAlpha = 1 - d; g.drawImage(off, x, y, 3, 3, ax - fr[4] + x, ay - fr[5] + y - d * 30, 3, 3); } g.globalAlpha = 1;
     }
  if (t > 2.4 && t < 3.3 && Math.floor(t * 6) % 2) { g.fillStyle = '#fff'; g.fillRect(ax + 10, ay - 52, 3, 7); g.fillRect(ax + 10, ay - 43, 3, 3); }
  // 公主：站在台阶下
  const px = 835 * S, py = 430 * S, pf = PI[Math.floor(t * 2) % 2]; if (PR.complete) { g.drawImage(PR, pf[0], pf[1], pf[2], pf[3], px - pf[4], py - pf[5], pf[2], pf[3]); }
  if (pxState === 'on') requestAnimationFrame(pxDraw); }
async function say(id, who, av, s) { const b = $('bub'), c = $('pc').getBoundingClientRect(), hx = 320, hy = who === '勇者' ? 66 : 120; b.style.left = c.left + hx / 640 * c.width + 'px'; b.style.top = c.top + hy / 360 * c.height + 'px'; b.style.display = 'block'; await type(b, s, id, 60); await wait(1400); b.style.display = 'none'; }
async function play() { const id = ++RUN; $('play').style.display = 'none'; reset();
  const P = [['g1', 'scale(1.04)', 'scale(1.14) translate(-2%, 1%)', ['卡带世界里，有一块和平的大陆。', '每到祭典，城里的街道总是热闹非凡。']],
             ['g2', 'scale(1.16) translate(2%, 2%)', 'scale(1.05)', ['直到有一天，这盘卡带被拿去违规烧录——', '别的游戏里的怪物，被硬塞了进来。']],
             ['g2b', 'scale(1.0)', 'scale(1.1) translate(-1%, 0)', ['数据裂开的地方，哥布林占了森林，', '吸血鬼占了古城，', '兽人踏平了平原……']],
             ['g3', 'scale(1.06) translate(0, 3%)', 'scale(1.14) translate(0, -3%)', ['公主露米娜在最后的神殿里发出呼唤——', '呼唤顺着卡带，传到了屏幕的另一边。']]];
  for (const [pg, a, b, lines] of P) { if (id !== RUN) return; const el = $(pg); el.classList.add('on'); kb(el.querySelector('.ill'), a, b, lines.length * 3200 + 1500); await wait(900);
    for (let li = 0; li < lines.length; li++) { const l = lines[li]; if (id !== RUN) return; if (pg === 'g2b') MK.go(li); await type($('cap'), l, id); await wait(1500); } if (pg === 'g2b') { MK.go(3); await wait(900); } $('cap').textContent = ''; if (pg !== 'g3') { el.classList.remove('on'); await wait(700); } }
  if (id !== RUN) return; const w = $('white'); w.style.transition = 'opacity .8s'; w.style.opacity = 1; await wait(900); $('g3').classList.remove('on');
  $('px').style.opacity = 1; pxState = 'on'; pxT0 = performance.now(); requestAnimationFrame(pxDraw); w.style.transition = 'opacity 1.4s'; w.style.opacity = 0; await wait(3600);
  if (id !== RUN) return; await say(id, '勇者', '../art/portrait/m.webp', '这是……我刚买的游戏里？');
  if (id !== RUN) return; await say(id, '露米娜', '../art/portrait/p.webp', '您就是回应召唤的勇者吧！');
  if (id !== RUN) return; await say(id, '露米娜', '../art/portrait/p.webp', '裂缝还在扩大……请帮帮这片大陆！');
  $('bub').style.display = 'none'; $('cap').textContent = '（演示结束：这里接第一站教学）'; $('play').style.display = 'block'; $('play').textContent = '↺ 再看一次'; }
function reset() { MK.reset(); pxState = 'off'; for (const e of document.querySelectorAll('.pg')) e.classList.remove('on'); $('px').style.opacity = 0; $('white').style.opacity = 0; $('bub').style.display = 'none'; $('cap').textContent = ''; }
$('play').onclick = play; $('skip').onclick = () => { RUN++; reset(); $('cap').textContent = '（已跳过：直接进第一站）'; $('play').style.display = 'block'; $('play').textContent = '↺ 再看一次'; };

// 2b 地图：念到哪里，哪块被墨色吞掉，冒出黑影标记；最后裂缝一闪整张变暗
const MK = (() => { const c = () => $('mk'); let on = [], t0 = 0, dark = 0; const IW = 1672, IH = 941;
  const SIL = n => Object.assign(new Image(), { src: n }), G1 = SIL('../art/goblin/gob_blade/idle0.png'), OR = SIL('../art/goblin/gob_troll/idle0.png');
  const R = [{ x: 300, y: 470, r: 230, ic: G1, n: 6 }, { x: 1360, y: 300, r: 200, bats: 1 }, { x: 880, y: 640, r: 260, ic: OR, n: 4 }];
  function go(i) { if (i < 3) on[i] = performance.now(); else dark = performance.now(); }
  function reset() { on = []; dark = 0; }
  function f(n) { const cv = c(); if (!cv) return requestAnimationFrame(f); const img = cv.parentNode.querySelector('.ill'), W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight, g = cv.getContext('2d');
    const rc = img.getBoundingClientRect(), pr = cv.getBoundingClientRect(), sx = rc.width / IW, P = (x, y) => [rc.left - pr.left + x * sx, rc.top - pr.top + y * rc.height / IH];
    R.forEach((r, i) => { if (!on[i]) return; const k = Math.max(0, Math.min(1, (n - on[i]) / 1400)), [x, y] = P(r.x, r.y), rr = r.r * sx * k;
      for (let j = 0; j < 7; j++) { const a = j * 2.4, d = rr * .35, gx = x + Math.cos(a) * d, gy = y + Math.sin(a) * d * .7, gr = g.createRadialGradient(gx, gy, 0, gx, gy, rr * .75); gr.addColorStop(0, 'rgba(30,14,6,.55)'); gr.addColorStop(1, 'rgba(30,14,6,0)'); g.fillStyle = gr; g.beginPath(); g.arc(gx, gy, rr * .75, 0, 7); g.fill(); }
      if (k > .5) { g.save(); g.globalAlpha = Math.min(1, (k - .5) * 2); g.filter = 'brightness(0)';
        if (r.ic && r.ic.complete) for (let q = 0; q < r.n; q++) { const s = (r.ic === OR ? 70 : 46) * sx, qx = x + (q - (r.n - 1) / 2) * s * .9, qy = y + (q % 2) * s * .45 + Math.sin(n / 200 + q) * 2; g.drawImage(r.ic, qx - s / 2, qy - s, s, s * r.ic.naturalHeight / r.ic.naturalWidth); }
        g.filter = 'none'; if (r.bats) { g.fillStyle = '#140804'; for (let q = 0; q < 9; q++) { const a = n / 600 + q * .7, bx = x + Math.cos(a) * rr * .45, by = y - rr * .25 + Math.sin(a * 1.3) * rr * .2, w = 11 + 5 * Math.sin(n / 60 + q); g.beginPath(); g.moveTo(bx - w, by - 3); g.lineTo(bx, by + 2); g.lineTo(bx + w, by - 3); g.lineTo(bx, by - 1); g.fill(); }
          g.globalAlpha = .9; g.beginPath(); g.moveTo(x - 8, y + 20); g.lineTo(x, y - 18); g.lineTo(x + 8, y + 20); g.fill(); }
        g.restore(); } });
    if (dark) { const k = Math.max(0, Math.min(1, (n - dark) / 900)); if (k < .25) { g.fillStyle = `rgba(255,190,90,${.5 * (1 - k * 4)})`; g.fillRect(0, 0, W, H * .35); } g.fillStyle = `rgba(20,10,4,${k * .55})`; g.fillRect(0, 0, W, H); }
    requestAnimationFrame(f); }
  requestAnimationFrame(f); return { go, reset }; })();
</script></body></html>
