<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>局外 · 宫殿据点灰盒</title>
<style>
html,body{margin:0;height:100%;background:#0c0908;overflow:hidden;touch-action:none;color:#f3e6c8;font:14px system-ui,sans-serif;user-select:none}
canvas{display:block}
#hud{position:fixed;left:8px;top:8px;pointer-events:none;text-shadow:0 1px 2px #000;line-height:1.5}
#act{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;gap:10px}
#act button,#panel button{font:inherit;padding:10px 18px;background:#3a2814;border:2px solid #c9a15a;color:#ffe9a8;border-radius:6px}
#dlg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:min(92vw,560px);display:none;background:rgba(250,244,230,.96);color:#3a2814;border:3px solid #3a2814;padding:10px 14px;gap:10px;align-items:center}
#dlg img{width:64px;height:64px;object-fit:cover;image-rendering:pixelated;border:2px solid #3a2814}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
#panel>div{background:#2a1d14;border:3px solid #c9a15a;padding:14px;width:min(92vw,460px);max-height:80vh;overflow:auto;border-radius:8px}
.up{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #4a3322}
.up small{display:block;color:#c8b890}
.up button{padding:6px 10px!important;white-space:nowrap}
.up button[disabled]{opacity:.4}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="act"></div>

<div id="panel"><div><h3 id="pt" style="margin:0 0 6px"></h3><div id="pl"></div><div style="text-align:right;margin-top:10px"><button id="pc">关闭</button></div></div></div>
<script src="js/data.js"></script><script src="js/sprites.js"></script>
<script>
// 11/24 宫殿据点灰盒（一张图）：最上空王座，公主站旁边、身边是时空门；中间大臣（钱+记录）和大法师；下面两排士兵；最下面大门走不出去。
// 地面、柱子、红毯都是代码画的灰盒，只验证路线、距离、按钮。正式美术出一整张图替换。
const cv = document.getElementById('c'), g = cv.getContext('2d'); let VW, VH, Z;
function fit() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; VW = cv.width; VH = cv.height; Z = Math.min(VW / 948, VH / 950); /* 手机宽度铺满，电脑按高度约一屏 */ } addEventListener('resize', fit); fit();
const W = 948, H = 1659, BG = Object.assign(new Image(), { src: 'art/hub/palace.webp' }), IM = s => Object.assign(new Image(), { src: s }), NI = {}; ['guard_idle0', 'guard_idle1', 'mage_idle0', 'mage_idle1', 'minister_idle0', 'minister_idle1'].forEach(k => NI[k] = IM('art/npc/' + k + '.png'));
const PORT = { p: IM('art/portrait/p.webp'), mage: IM('art/npc/mage_face.png'), guard: IM('art/npc/guard_face.png') };
const QS = new URLSearchParams(location.search), GAME = QS.has('game'), HS = QS.get('h') === 'f' ? 'f' : 'm';
const LS = { get: k => { try { return localStorage.getItem('xsyz-' + k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem('xsyz-' + k, v); } catch (e) {} } };
let crystal = GAME ? +LS.get('crystal') || 0 : 120, owned = GAME ? (() => { try { return JSON.parse(LS.get('meta') || '{}'); } catch (e) { return {}; } })() : {};
const SOON = new Set(['book', 'spin', 'step']);   // 这几项效果还没接进游戏
const UP = {
  p: [['life', '续命', '每局多 1 条命（基础 2 条）', [60, 140]], ['hp', '生命', '最大生命 +5%', [20, 35, 55, 80, 110]], ['rev', '复活', '用命复活时多回 20% 生命', [50]]],
  m: [['book', '开局技能书', '开局多选一次技能书', [70]], ['xp', '突破', '技能书升级所需经验 −5%', [30, 50, 80]], ['spin', '再抽一次', '老虎机每站免费重转 1 次', [60]]],
  s: [['roll3', '三格翻滚', '开局就有 3 格翻滚', [90]], ['step', '身法', '开局随机带 1 个身法', [70]], ['eva', '闪避', '基础闪避 +1%', [25, 45, 70]]],
  c: [['coin', '开局铜钱', '开局铜钱 +20', [20, 40, 60]], ['disc', '折扣', '局内商店价格 −5%', [50]], ['ex', '兑换', '局内商人用铜钱换水晶的汇率更好', [40]]],
};
const NPC = [
  { id: 'p', name: '露米娜', x: 680, y: 330, kind: 'princess', av: PORT.p, lines: ['你回来了。时空门就在我身边，准备好了就出发吧。', '王座……父王走后，一直空着。'], up: 'p', upName: '公主的祝福' },
  { id: 'm', name: '大法师', x: 640, y: 760, kind: 'mage', av: PORT.mage, lines: ['你带回来的那些技能书，我研究过了。', '水晶给我，我能让你的法术更快成形。'], up: 'm', upName: '大法师的研究' },
  { id: 'c', name: '大臣', x: 300, y: 760, kind: 'minister', av: PORT.mage, lines: ['国库和账本都归老臣管。', '您的战绩，老臣都记着呢。'], up: 'c', upName: '国库', rec: 1 },
  { id: 's', name: '士兵甲', x: 300, y: 1020, kind: 'guard', av: PORT.guard, lines: ['他又回来了。', '要不要去训练场转转？——哦，我们没有训练场。'], up: 's', upName: '士兵的训练' },
  { id: 's2', name: '士兵乙', x: 640, y: 1020, kind: 'guard', av: PORT.guard, lines: ['墙不够刻了。'], },
  { id: 's3', name: '士兵丙', x: 300, y: 1330, kind: 'guard', av: PORT.guard, lines: ['站岗好无聊。'] },
  { id: 's4', name: '士兵丁', x: 640, y: 1330, kind: 'guard', av: PORT.guard, lines: ['屏幕那一边，大概没有哥布林吧。'] },
];
const PORTAL = { x: 755, y: 275 }, DOOR = { x: 474, y: 1450 }, THRONE = { x: 474, y: 230 };
const hero = { x: 474, y: 1400, f: 1, mv: 0 }, K = {}; let go1 = 0, joy = null, near = null, cam = { x: 474, y: 1400 }, T = 0, last = 0, msg = '', msgT = 0;
const walk = (x, y) => x > 112 && x < 836 && y > 235 && y < 1440 && !(x > 270 && x < 678 && y < 392) && !NPC.some(n => Math.hypot(n.x - x, (n.y - y) * 1.6) < 34);
addEventListener('keydown', e => { K[e.code] = 1; if (e.code === 'KeyE' && near) act(near, 0); }); addEventListener('keyup', e => K[e.code] = 0);
addEventListener('touchstart', e => { const t = e.changedTouches[0]; if (t.target === cv && t.clientX < innerWidth * .6) joy = { id: t.identifier, x: t.clientX, y: t.clientY, dx: 0, dy: 0 }; }, { passive: true });
addEventListener('touchmove', e => { for (const t of e.changedTouches) if (joy && t.identifier === joy.id) { joy.dx = t.clientX - joy.x; joy.dy = t.clientY - joy.y; } }, { passive: true });
addEventListener('touchend', () => joy = null);
const $ = id => document.getElementById(id);
// 11/24 对话 = 说话人头上冒气泡（和塔顶一样），不用头像框
let BUB = null; function say(n, s) { const o = NPC.find(q => q.id === n.id) || n; BUB = { n: o, txt: s, t: 0, T: Math.max(2.4, s.length * .16) }; }
function drawBub() { if (!BUB) return; BUB.t += 1 / 60; if (BUB.t > BUB.T) { BUB = null; return; } const n = BUB.n, show = BUB.txt.slice(0, Math.ceil(BUB.t * 18));
  g.font = 'bold 24px sans-serif'; const w = Math.min(560, g.measureText(BUB.txt).width + 28), x = Math.max(10, Math.min(W - w - 10, n.x - w / 2)), y = n.y - (n.kind === 'princess' ? 200 : 180);
  g.fillStyle = 'rgba(250,244,230,.97)'; g.fillRect(x, y - 34, w, 44); g.strokeStyle = '#3a2814'; g.lineWidth = 3; g.strokeRect(x, y - 34, w, 44);
  g.fillStyle = 'rgba(250,244,230,.97)'; g.beginPath(); g.moveTo(n.x - 8, y + 9); g.lineTo(n.x + 8, y + 9); g.lineTo(n.x, y + 22); g.fill(); g.fillStyle = '#3a2814'; g.fillText(show, x + 14, y - 3); }
function act(n, k) { if (n === PORTAL) { if (GAME) { parent.postMessage('introDone', '*'); return; } msg = '走进时空门 → 出发（demo 到此为止）'; msgT = 2.5; return; } if (k === 1 && n.up) return panel(n); n.li = ((n.li || 0) + 1) % n.lines.length; say(n, n.lines[n.li]); }
function panel(n) { $('pt').textContent = n.upName + `　（水晶 ${crystal}）`; const L = $('pl'); L.innerHTML = '';
  if (n.rec) { const d = document.createElement('div'); d.className = 'up'; let R = {}; try { R = JSON.parse(LS.get('rec') || '{}'); } catch (e) {} d.innerHTML = `<div><b>战绩</b><small>最远：${R.best >= 99 ? '通关' : R.best ? '第 ' + R.best + ' 站' : '—'} · 击杀 ${(R.kills || 0).toLocaleString()} · 倒下 ${R.deaths || 0} 次 · 通关 ${R.wins || 0} 次</small></div>`; L.appendChild(d); }
  for (const [id, name, desc, cost] of UP[n.up]) { const lv = owned[id] || 0, max = cost.length, c = cost[lv], d = document.createElement('div'); d.className = 'up';
    d.innerHTML = `<div><b>${name}</b> ${'●'.repeat(lv)}${'○'.repeat(max - lv)}<small>${desc}</small></div>`; const b = document.createElement('button'); b.textContent = lv >= max ? '已满' : `💎 ${c}`; b.disabled = lv >= max || crystal < c;
    if (SOON.has(id)) { b.textContent = '即将开放'; b.disabled = true; } b.onclick = () => { crystal -= c; owned[id] = lv + 1; if (GAME) { LS.set('crystal', crystal); LS.set('meta', JSON.stringify(owned)); } panel(n); }; d.appendChild(b); L.appendChild(d); }
  $('panel').style.display = 'flex'; }
$('pc').onclick = () => $('panel').style.display = 'none';
function updAct() { const a = $('act'); a.innerHTML = ''; if (!near) { a.style.display = 'none'; return; } a.style.display = 'flex';
  const mk = (t, k) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => act(near, k); a.appendChild(b); };
  if (near === PORTAL) mk('进入时空门 ▶', 0); else { mk('对话', 0); if (near.up) mk('强化', 1); } }
function fr(set, base, sp) { const S = SPR.sets[set]; if (!S || !S.f) return null; let c = 0; while (S.f[base + c]) c++; return c ? base + (Math.floor(T * sp) % c) : S.f.idle0 ? 'idle0' : Object.keys(S.f)[0]; }
function drawNPC(n) { const tick = Math.floor(T * 1.6 + n.x) % 2, s = 2.2;
  if (n.kind === 'guard' || n.kind === 'mage' || n.kind === 'minister') { const im = NI[(n.kind === 'guard' ? 'guard_idle' : n.kind === 'minister' ? 'minister_idle' : 'mage_idle') + tick]; if (im.complete) { g.save(); if (n.x > 500) { g.translate(n.x * 2, 0); g.scale(-1, 1); } g.drawImage(im, n.x - im.width * s / 2, n.y - im.height * s, im.width * s, im.height * s); g.restore(); } }
  else if (SPR.sets.heroP) { const nm = fr('heroP', 'idle', 2); SPR.draw(g, 'heroP', nm, 0, n.x, n.y, true, 2); }
  else { g.fillStyle = '#f3b8d0'; g.beginPath(); g.moveTo(n.x - 34, n.y); g.lineTo(n.x + 34, n.y); g.lineTo(n.x + 14, n.y - 90); g.lineTo(n.x - 14, n.y - 90); g.fill(); g.fillStyle = '#f6dcc0'; g.beginPath(); g.arc(n.x, n.y - 108, 20, 0, 7); g.fill(); g.fillStyle = '#f2d16a'; g.fillRect(n.x - 22, n.y - 132, 44, 18); g.fillStyle = '#ffd77a'; g.fillRect(n.x - 12, n.y - 140, 24, 8); }
  g.fillStyle = near === n ? '#ffe9a8' : 'rgba(255,240,210,.75)'; g.font = 'bold 22px sans-serif'; const w = g.measureText(n.name).width; g.fillText(n.name, n.x - w / 2, n.y - (n.kind === 'princess' ? 150 : 128)); }
function loop(n) { const dt = Math.min(.033, (n - last) / 1000 || 0); last = n; T += dt; requestAnimationFrame(loop);
  let x = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0), y = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0); if (joy && Math.hypot(joy.dx, joy.dy) > 8) { x = joy.dx; y = joy.dy; }
  const l = Math.hypot(x, y); hero.mv = l > 0; if (l && $('panel').style.display !== 'flex') { x /= l; y /= l; const sp = 300 * dt; if (x) hero.f = x > 0 ? 1 : -1; if (walk(hero.x + x * sp, hero.y)) hero.x += x * sp; if (walk(hero.x, hero.y + y * sp)) hero.y += y * sp; }
  if (hero.y > 1425 && Math.abs(hero.x - 474) < 110 && !msgT) { msg = '大门紧闭……门缝外全是乱码。'; msgT = 2.5; } if (msgT > 0) msgT -= dt;
  if (GAME && Math.hypot(hero.x - PORTAL.x, (hero.y - PORTAL.y) * 1.4) < 40 && !go1) { go1 = 1; parent.postMessage('introDone', '*'); }
  let nb = null, bd = 150; for (const o of [...NPC, PORTAL]) { const d = Math.hypot(o.x - hero.x, (o.y - hero.y) * 1.4); if (d < bd) { bd = d; nb = o; } } if (nb !== near) { near = nb; updAct(); }
  cam.x += (Math.max(Math.min(hero.x, W - VW / Z / 2), VW / Z / 2) - cam.x) * .1; if (VW / Z >= W) cam.x = W / 2; cam.y += (Math.max(Math.min(hero.y - 60, H - VH / Z / 2), VH / Z / 2) - cam.y) * .1;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#0c0908'; g.fillRect(0, 0, VW, VH); g.setTransform(Z, 0, 0, Z, Math.round(VW / 2 - cam.x * Z), Math.round(VH / 2 - cam.y * Z));
  if (BG.complete && BG.naturalWidth) { g.imageSmoothingEnabled = Z * (devicePixelRatio || 1) < 1; g.drawImage(BG, 0, 0); } else { g.fillStyle = '#5a4c42'; g.fillRect(0, 0, W, H); }
  // 时空门
  { const k = .7 + .3 * Math.sin(T * 3); g.save(); g.translate(PORTAL.x, PORTAL.y - 75); g.strokeStyle = `rgba(160,210,255,${k})`; g.lineWidth = 6; g.beginPath(); g.ellipse(0, 0, 42, 72, 0, 0, 7); g.stroke(); g.fillStyle = `rgba(90,140,230,${.35 * k})`; g.fill();
    for (let i = 0; i < 6; i++) { const a = T * 2 + i; g.fillStyle = '#cfe8ff'; g.fillRect(Math.cos(a) * 40 - 2, Math.sin(a * 1.3) * 60 - 2, 4, 4); } g.restore(); g.fillStyle = '#cfe8ff'; g.font = 'bold 22px sans-serif'; g.fillText('时空门', PORTAL.x - 33, PORTAL.y - 160); }
  const L = NPC.map(n => ({ y: n.y, n })).concat([{ y: hero.y, h: 1 }]).sort((a, b) => a.y - b.y);
  for (const e of L) { if (e.n) drawNPC(e.n); else { const hs = SPR.heroSet && SPR.heroSet(HS), nm = hs && (hero.mv ? fr(hs, 'run', 12) || fr(hs, 'walk', 10) : fr(hs, 'idle', 2)); if (nm) SPR.drawHero(g, nm, 0, hero.x, hero.y, hero.f < 0, 2); else { g.fillStyle = '#fff'; g.fillRect(hero.x - 10, hero.y - 50, 20, 50); } } }
  drawBub();
  if (msgT > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(0, VH * .4 - 30 * devicePixelRatio, VW, 50 * devicePixelRatio); g.fillStyle = '#ffe9a8'; g.font = `${20 * devicePixelRatio}px sans-serif`; g.fillText(msg, VW / 2 - g.measureText(msg).width / 2, VH * .4); }
  $('hud').innerHTML = GAME ? `💎 水晶 ${crystal}${CONT ? `　❤ 还剩 ${CONT} 条命` : ''}<br><small>走进公主身边的时空门出发</small>` : `宫殿据点（正式美术，一张图，镜头上下跟随）<br>💎 水晶 ${crystal}（demo 送的）<br>WASD 走 · 靠近人按 E 对话 / 点按钮`; }
const CONT = +QS.get('cont') || 0, CRY = +QS.get('cry') || 0;
if (GAME) { let L = []; try { L = JSON.parse(QS.get('L') || '[]'); } catch (e) {} (async () => { const w = t => new Promise(r => setTimeout(r, t)); await w(600); if (CRY) { msg = `带回 ${CRY} 水晶`; msgT = 2; await w(1800); }
  for (const [who, txt] of L) { const n = NPC.find(o => o.name === who) || (who === '露米娜' ? NPC[0] : NPC[3]); say(n, txt); await w(Math.max(2200, txt.length * 160)); } })(); }
Promise.resolve(SPR.load && SPR.load()).catch(() => 0); requestAnimationFrame(loop);
</script></body></html>
