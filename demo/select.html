<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>选人界面（局外）</title>
<link rel="stylesheet" href="css/style.css">
<style>
html,body{margin:0;height:100%;background:#1a120a;overflow:hidden}
#prep{display:flex !important;position:fixed;inset:0}
.stage{position:relative;flex:1 1 auto;min-height:150px;border:0;overflow:hidden;background:none}
#prep .stage canvas{position:absolute !important;left:0 !important;top:0 !important;width:100% !important;height:100% !important;max-width:none !important;image-rendering:pixelated}
.stage .lab,.stage .act{display:none}.stage .lab{position:absolute;left:10px;top:6px;z-index:2;font:14px WenKai,serif;color:#fff3d0;text-shadow:1px 1px 0 #000}
.stage .act{position:absolute;right:10px;top:6px;z-index:2;font:14px WenKai,serif;color:#ffd860;text-shadow:1px 1px 0 #000}
.pnSec.st{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.pnSec.st h4{flex:none}
#note{position:fixed;right:8px;top:6px;max-width:46vw;z-index:9;font:12px sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px}
.pnWep button{cursor:pointer}
.bkI{width:48px;height:48px;image-rendering:pixelated}
@media (orientation:portrait){#prep .pnew{grid-template-rows:26vh auto !important}.stage{min-height:130px}}
</style></head><body>
<div id="prep" class="scr menu on"><div class="pnew">
 <div class="pnL"><img id="pPort" alt=""></div>
 <div class="pnR">
  <div class="pnPick"><span>选择勇者</span><div class="pnSel csel" id="cSel"></div></div>
  <div class="pnSec"><h4>起手兵器</h4><div class="pnWep" id="wSel"></div><p class="wdesc" id="wDesc"></p></div>
  <div class="pnSec st"><h4>战斗演示</h4><div class="stage"><canvas id="cv"></canvas><span class="lab" id="lab"></span><span class="act" id="act"></span></div></div>
  <div class="pnFoot"><button class="btn">返回</button><button class="btn gold">出发！</button></div>
 </div></div></div>

<script src="js/data.js"></script><script src="js/sprites.js"></script><script src="js/skframes.js"></script>
<script>
const $=id=>document.getElementById(id);
let hero='m',wp='sword',sk=0;
const BK={sword:'bk_sword',spear:'bk_spear',bow:'bk_bow',staff:'bk_wand'},NM={m:'阿远',f:'小凛'},SK2={sword:'whirl',spear:'sweep',bow:'fan',staff:'nova'};
function render(){
 $('pPort').src='art/portrait/'+hero+'.webp';
 const cs=$('cSel');cs.innerHTML='';
 for(const h of ['m','f']){const b=document.createElement('button');b.className=h===hero?'on':'';const cr=SPR.crop(SPR.heroSet(h,wp),wp+'.idle',0);if(cr)b.appendChild(cr.c);b.insertAdjacentHTML('beforeend','<span>'+NM[h]+'</span>');b.onclick=()=>{hero=h;render()};cs.appendChild(b)}
 const ws=$('wSel');ws.innerHTML='';
 for(const [id,w] of Object.entries(DATA.weapons)){const b=document.createElement('button');b.className=id===wp?'on':'';b.innerHTML='<img class="bkI" src="art/ui2/'+BK[id]+'.png"><span>'+w.name+'</span>';b.onclick=()=>{wp=id;sk=0;tClock=0;casted=0;fx=[];shots=[];render()};ws.appendChild(b)}
 $('wDesc').innerHTML=[wp,SK2[wp]].map((id,k)=>{const S=DATA.skills[id]||{};return `<div class="skI${sk===k?' on':''}" data-k="${k}"><div class="skIc"><img class="skic" src="art/ui2/sk/${id}.png" alt=""></div><div class="skIb"><div class="skIt"><b>${S.name||id}</b><em>${S.dt==='magic'?'魔法':'物理'}</em></div><p>${S.desc||''}</p></div></div>`}).join('');
 for(const e of $('wDesc').children)e.onclick=()=>{sk=+e.dataset.k;tClock=0;casted=0;fx=[];shots=[];render()};
}
const PI=Math.PI,YS=1.35,rd=Math.round;
let fx=[],shots=[],T0=0,CAST=2.6,castId=null,castT=-1,ctxu=2;
function sizeUp(c){const r=c.getBoundingClientRect();if(r.width&&(c.width!==Math.round(r.width)||c.height!==Math.round(r.height))){c.width=Math.round(r.width);c.height=Math.round(r.height)}}
function startCast(c,u,hx,hy){ // 每招的出手：照 js/skills.js 的参数
 const id=castId,y=hy-14*u;
 if(id==='sword')fx.push({k:'slash',x:hx,y:y,a:0,t:0,T:.2,r:52,half:1.18});
 else if(id==='whirl')fx.push({k:'ring',x:hx,y:y,t:0,T:.3,r:40,col:'#e8ecf4'});
 else if(id==='spear')fx.push({k:'thrust',x:hx,y:y,a:0,L:82,w:14,t:0,T:.2});
 else if(id==='sweep')fx.push({k:'slash',x:hx,y:y,a:0,t:0,T:.22,r:48,half:1.4,wood:true});
 else if(id==='bow')shots.push({k:'arrow',x:hx,y:y,vx:320*u,vy:0,t:0,T:.7});
 else if(id==='fan'){for(let i=0;i<5;i++){const a=(i-2)*.25;shots.push({k:'arrow',x:hx,y:y,vx:300*u*Math.cos(a),vy:300*u*Math.sin(a)/YS*.35,t:0,T:.35})}}
 else if(id==='staff'){const tx=hx+Math.min(150*u,c.width*.5-hx);shots.push({k:'fire',x:tx,y:hy,t:0,T:.5,r:30,boom:1})}
 else if(id==='nova')fx.push({k:'frost',x:hx,y:hy-8*u,t:0,T:.45,r:44});
}
function drawFx(g,u,dt){
 const X=v=>v,Y=v=>v;
 for(const o of fx){o.t+=dt;const p=o.t/o.T;
  if(o.k==='slash'){const hf=o.half,C3=o.wood?['#f0e0c0','#c8a070','#8a5a2a']:['#ffffff','#fff2b0','#f0c04c'];for(let k=0;k<3;k++){const r=(o.r-k*4)*u;for(let a=-hf;a<=hf;a+=.04){const t=(a+hf)/(2*hf);if(t>p*1.6)continue;if(p>.6&&(Math.floor(a*40)%2))continue;const aa=o.a+a;g.fillStyle=C3[k];const q=k===0?2*u:u;g.fillRect(o.x+rd(Math.cos(aa)*r),o.y+rd(Math.sin(aa)*r/YS),q,q)}}}
  else if(o.k==='thrust'){const L=o.L*u*Math.min(1,p*2.2),ca=Math.cos(o.a),sa=Math.sin(o.a)/YS;for(let d=0;d<L;d+=u){const k=d/(o.L*u);g.fillStyle=k>.85?'#ffffff':p>.6?'#f0c04c':'#fff2b0';const q=k>.85?2*u:u;g.fillRect(o.x+rd(ca*d),o.y+rd(sa*d),q,q);if(d%(3*u)<u&&p<.5){const w=o.w*u*.5;g.fillStyle='rgba(255,240,180,.6)';g.fillRect(o.x+rd(ca*d-sa*w),o.y+rd(sa*d+ca*w),u,u);g.fillRect(o.x+rd(ca*d+sa*w),o.y+rd(sa*d-ca*w),u,u)}}}
  else if(o.k==='frost'){const r=o.r*u*(.3+p*.8);for(let a=0;a<PI*2;a+=.05){if(p>.6&&Math.floor(a*20)%2)continue;g.fillStyle=p<.4?'#ffffff':'#8ad8ff';g.fillRect(o.x+rd(Math.cos(a)*r),o.y+rd(Math.sin(a)*r/YS),2*u,2*u)}if(p<.35){g.fillStyle='rgba(160,220,255,.25)';g.beginPath();g.ellipse(o.x,o.y,r,r/YS,0,0,7);g.fill()}}
  else if(o.k==='ring'){const r=o.r*u*(.6+p*.8);for(let a=0;a<PI*2;a+=.05){g.fillStyle=p<.5?'#fff2c0':(o.col||'#c8a066');g.fillRect(o.x+rd(Math.cos(a)*r),o.y+rd(Math.sin(a)*r/YS),2*u,2*u)}}
  else if(o.k==='boom'){const r=o.r*u*(.5+p*.7);for(let a=0;a<PI*2;a+=.06){if(Math.floor(a*10+o.t*30)%3===0)continue;g.fillStyle=p<.4?'#fff2a0':p<.7?'#ff9a30':'#a03a18';g.fillRect(o.x+rd(Math.cos(a)*r),o.y+rd(Math.sin(a)*r/YS),2*u,2*u)}if(p<.3){g.fillStyle='rgba(255,230,140,.35)';g.beginPath();g.ellipse(o.x,o.y,r*.8,r*.8/YS,0,0,7);g.fill()}}}
 fx=fx.filter(o=>o.t<o.T);
 for(const o of shots){o.t+=dt;
  if(o.k==='arrow'){o.x+=o.vx*dt;o.y+=o.vy*dt;const f=SPR.frame('gob_archer','arrow');if(f){g.save();g.translate(o.x,o.y);g.rotate(Math.atan2(o.vy,o.vx));const q=u*.5*(SPR.sets.gob_archer.sk||1);g.drawImage(SPR.sets.gob_archer.base,f.x,f.y,f.w,f.h,-f.w*q/2,-f.h*q/2,f.w*q,f.h*q);g.restore()}else{g.fillStyle='#8a5a2a';g.fillRect(o.x,o.y,6*u,u)}}
  else if(o.k==='fire'){const p=o.t/o.T,hy=(1-p)*Math.min(120,o.y/u-12);for(let j=0;j<5;j++){g.fillStyle=['#fff6c0','#ffd060','#ff8a30','#e04a20','#902a10'][j];const q=(5-j)*u;g.fillRect(o.x-q/2-rd(j*3*u*(1-p)),o.y-rd((hy+j*7)*u)-q/2,q,q)}if(o.t>=o.T&&o.boom){o.boom=0;fx.push({k:'boom',x:o.x,y:o.y,t:0,T:.35,r:o.r})}}}
 shots=shots.filter(o=>o.t<o.T&&o.x<9999);
}
let tPrev=performance.now(),tClock=0,casted=0;
function frame(){
 const c=$('cv');sizeUp(c);const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,c.width,c.height);
 const now=performance.now(),dt=Math.min(.05,(now-tPrev)/1000);tPrev=now;tClock+=dt;
 const id=sk?SK2[wp]:wp;castId=id;
 const u=Math.max(2,Math.min(3,Math.floor(c.height/78))),hx=Math.max(70,c.width*.18),hy=c.height*.8,F=SKF.get(id),T=tClock%CAST;
 let n,i;
 if(T<.25){const r=SKF.pick(F,'wu',T);if(r){n=r[0];i=r[1]}}
 else if(T<.25+F.hitT){if(!casted){casted=1;startCast(c,u,hx,hy)}const r=SKF.pick(F,'hit',T-.25);if(r){n=r[0];i=r[1]}}
 else{const r=SKF.pick(F,'rc',T-.25-F.hitT);if(r){n=r[0];i=r[1]}if(T>CAST-.05)casted=0}
 if(T<.02)casted=0;
 const hs=SPR.heroSet(hero,wp);if(!n){n='idle';i=Math.floor(tClock*3)%Math.max(1,SPR.count(hs,wp+'.idle')||SPR.count(hs,'idle'))}
 g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(hx,hy,u*9,u*3,0,0,7);g.fill();
 try{SPR.drawHero(g,n,i,hx,hy,false,u,{w:wp,c:hero})}catch(e){}
 drawFx(g,u,dt);
 requestAnimationFrame(frame);}
Promise.resolve(SPR.load()).then(()=>{render();frame()});
</script></body></html>
