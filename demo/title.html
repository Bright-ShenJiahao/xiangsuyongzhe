<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素勇者 · 主界面氛围演示</title>
<style>
@font-face { font-family: WenKai; src: url(../art/font/kai.woff2?v=2); }
body { margin: 0; background: #0b0f1a; color: #f4ecd8; font: 14px WenKai, sans-serif; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; background: #1a120c; position: sticky; top: 0; z-index: 5; }
.bar label { background: #2a1e14; border: 2px solid #5a4028; padding: 2px 8px; cursor: pointer; user-select: none; } .bar input { vertical-align: -2px; }
.wrap { position: relative; width: 100%; max-width: 1400px; margin: auto; aspect-ratio: 1672 / 941; overflow: hidden; }
.wrap img, .wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; transition: transform .2s ease-out; }
.wrap canvas { inset: 0; width: 100%; height: 100%; transition: none; }
.note { max-width: 1400px; margin: 8px auto; padding: 0 10px; color: #b8a888; line-height: 1.8; }
</style></head><body>
<div class="bar" id="bar"></div>
<div class="wrap" id="wrap"><img id="bg" src="../art/title/art13.webp"><canvas id="cv"></canvas></div>
<div class="note" id="note"></div>
<script>
const FX = [
  ['bats', '① 蝙蝠飞过月亮', '几只像素蝙蝠扑腾翅膀，从右往左横穿月亮，隔几秒一群。'],
  ['sword', '② 剑刃闪光', '每隔 3 秒，一道白光从剑柄扫到剑尖，剑尖亮个十字星。'],
  ['gem', '③ 法杖宝石脉动', '女主法杖顶上的蓝宝石一亮一暗，偶尔冒出小蓝火花往上飘。'],
  ['crystal', '④ 公主手中水晶', '公主捧着的水晶发出呼吸光，周围几颗小光点绕着转。'],
  ['eyes', '⑤ 哥布林眼睛', '左右的哥布林眼睛冒黄光，偶尔眨一下。'],
  ['fire', '⑥ 城墙火把', '城墙上两支火把的火苗跳动，冒火星（游戏里已有 8 帧火，这里是简化版）。'],
  ['fly', '⑦ 萤火虫', '树林里飘着黄绿色的萤火虫，忽明忽暗。'],
  ['mist', '⑧ 地面薄雾', '脚下一层雾慢慢往右飘。'],
  ['moss', '⑨ 月光闪烁', '月亮表面的光一层层慢慢呼吸（微弱）。'],
  ['para', '⑩ 鼠标视差', '鼠标移动时，背景跟着轻微反向移动，有纵深感（手机端用陀螺仪或不做）。'],
];
const on = {}; const bar = document.getElementById('bar'), note = document.getElementById('note');
for (const [k, t, d] of FX) { on[k] = true; const l = document.createElement('label'); l.innerHTML = `<input type="checkbox" checked> ${t}`; l.querySelector('input').onchange = e => on[k] = e.target.checked; bar.appendChild(l); note.insertAdjacentHTML('beforeend', `<b>${t}</b>：${d}<br>`); }
note.insertAdjacentHTML('beforeend', '<br>勾选开关单独看每一种。挑出要的告诉我，再放进游戏。');
const cv = document.getElementById('cv'), g = cv.getContext('2d'), IW = 1672, IH = 941, S = 4;   // 画在 1/4 分辨率上再放大 = 像素感
cv.width = IW / S; cv.height = IH / S; g.imageSmoothingEnabled = false;
const P = (x, y) => [x / S, y / S], px = (x, y, c, w = 1, h = 1) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
let bats = [], batT = 0, flies = Array.from({ length: 26 }, () => ({ x: Math.random() * IW / S, y: (420 + Math.random() * 480) / S, p: Math.random() * 9, v: Math.random() * .3 + .1 })), sparks = [];
const BAT = [['.x.....x.', 'xxx.x.xxx', '.xxxxxxx.', '...xxx...'], ['.........', '...x.x...', 'xxxxxxxxx', 'x..xxx..x']];
function frame(ts) { const t = ts / 1000; g.clearRect(0, 0, cv.width, cv.height);
  if (on.moss) { const [mx, my] = P(662, 115), a = .06 + .05 * Math.sin(t * 1.3); g.fillStyle = `rgba(200,230,255,${a})`; for (let r = 38; r > 20; r -= 6) { g.beginPath(); g.arc(mx, my, r, 0, 7); g.fill(); } }
  if (on.bats) { if ((batT -= 1 / 60) <= 0) { batT = 5 + Math.random() * 4; const y0 = 60 + Math.random() * 120, n = 3 + Math.random() * 3 | 0; for (let i = 0; i < n; i++) bats.push({ x: IW / S + i * 14 + Math.random() * 10, y: y0 / S + (Math.random() - .5) * 18, v: .7 + Math.random() * .4, ph: Math.random() * 6 }); }
    for (const b of bats) { b.x -= b.v; b.y += Math.sin(t * 3 + b.ph) * .2; const f = BAT[Math.floor(t * 8 + b.ph) % 2]; f.forEach((r, j) => [...r].forEach((c, i) => c === 'x' && px(b.x + i, b.y + j, '#0e0a1a'))); } bats = bats.filter(b => b.x > -20); }
  if (on.sword) { const k = (t % 3) / .6; if (k < 1) { const [x0, y0] = P(812, 520), [x1, y1] = P(955, 345); for (let j = -2; j <= 2; j++) { const q = k + j * .04; if (q < 0 || q > 1) continue; px(x0 + (x1 - x0) * q, y0 + (y1 - y0) * q, j ? 'rgba(255,255,255,.6)' : '#fff', 2, 2); } }
    if (k >= .9 && k < 1.5) { const [x1, y1] = P(955, 345), r = Math.round(4 * Math.sin((k - .9) / .6 * Math.PI)); for (let i = -r; i <= r; i++) { px(x1 + i, y1, '#fff'); px(x1, y1 + i, '#fff'); } } }
  if (on.gem) { const [x, y] = P(347, 352), a = .35 + .3 * Math.sin(t * 2.4); g.fillStyle = `rgba(90,150,255,${a})`; g.fillRect(x - 5, y - 5, 10, 10); g.fillStyle = `rgba(190,220,255,${a})`; g.fillRect(x - 2, y - 2, 4, 4);
    if (Math.random() < .06) sparks.push({ x: x + (Math.random() - .5) * 8, y, vy: -.3 - Math.random() * .3, l: 1, c: '#8ec0ff' }); }
  if (on.crystal) { const [x, y] = P(610, 268), a = .3 + .25 * Math.sin(t * 1.8); g.fillStyle = `rgba(180,240,255,${a})`; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); for (let i = 0; i < 4; i++) { const an = t * 1.5 + i * Math.PI / 2; px(x + Math.cos(an) * 11, y + Math.sin(an) * 5, '#dff8ff'); } }
  if (on.eyes) for (const [ex, ey, ph] of [[222, 645, 0], [237, 645, 0], [985, 712, 2], [1000, 711, 2], [1047, 638, 4], [1060, 637, 4], [100, 299, 1], [112, 299, 1]]) { const bl = ((t + ph) % 4) < .12; if (bl) continue; const [x, y] = P(ex, ey); g.fillStyle = `rgba(255,230,60,${.5 + .3 * Math.sin(t * 3 + ph)})`; g.fillRect(x - 1, y - 1, 3, 2); }
  if (on.fire) for (const [fx, fy] of [[136, 182], [383, 225]]) { const [x, y] = P(fx, fy); for (let j = 0; j < 4; j++) { const h = 3 + Math.random() * 4; px(x - 2 + j, y - h, ['#fff6c0', '#ffd060', '#ff8a30', '#e04a20'][j], 1, h); } if (Math.random() < .1) sparks.push({ x, y: y - 6, vy: -.4, l: 1, c: '#ffb040' }); }
  for (const s of sparks) { s.y += s.vy; s.x += (Math.random() - .5) * .4; s.l -= .02; if (s.l > 0) { g.globalAlpha = s.l; px(s.x, s.y, s.c); g.globalAlpha = 1; } } sparks = sparks.filter(s => s.l > 0);
  if (on.fly) for (const f of flies) { f.x += Math.sin(t * .7 + f.p) * f.v; f.y += Math.cos(t * .5 + f.p * 2) * f.v * .6; const a = .5 + .5 * Math.sin(t * 2 + f.p); if (a > .2) { g.globalAlpha = a; px(f.x, f.y, '#e8ff80'); g.globalAlpha = a * .35; px(f.x - 1, f.y - 1, '#e8ff80', 3, 3); g.globalAlpha = 1; } }
  if (on.mist) { for (let i = 0; i < 8; i++) { const x = ((t * 6 + i * 60) % (IW / S + 120)) - 60, y = (850 + (i % 3) * 25) / S; g.fillStyle = 'rgba(190,200,230,.07)'; g.fillRect(x, y, 70, 6); g.fillRect(x + 10, y - 3, 46, 3); } }
  requestAnimationFrame(frame); }
requestAnimationFrame(frame);
const wrap = document.getElementById('wrap'), bg = document.getElementById('bg');
wrap.onmousemove = e => { if (!on.para) { bg.style.transform = ''; return; } const r = wrap.getBoundingClientRect(), dx = (e.clientX - r.left) / r.width - .5, dy = (e.clientY - r.top) / r.height - .5; bg.style.transform = `scale(1.03) translate(${-dx * 14}px, ${-dy * 8}px)`; };
</script></body></html>
