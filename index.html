<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="像素勇者">
<title>像素勇者</title>
<link rel="icon" type="image/png" href="art/ui/icon-192.png"><link rel="apple-touch-icon" href="art/ui/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="art/ui2/map.webp" as="image">
<link rel="preload" href="art/font/kai.woff2?v=6" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="art/title/art13.webp" as="image">
</head><body>
<canvas id="cv"></canvas><div id="hurtV"></div>

<!-- 加载页：深夜卧室打游戏机（js/boot.js） -->

<!-- 主界面（照三国终章：左边大图，右边标题和「新的开始」，右上角 图鉴 / 设置 / 帮助） -->
<div id="title" class="scr on t2 v13">
  <div class="tart"></div>
  <div class="ttop"><button class="btn mini" data-panel="codex">图鉴</button><button class="btn mini" data-panel="set">设置</button><button class="btn mini" data-panel="help">帮助</button></div>
  <div class="tbox">
    <div class="logo"><img class="lg2" src="art/title/logo2.png" alt="像素勇者" draggable="false"></div>
    <div class="sub"><s></s>深夜两点的冒险<s></s></div>
    <div class="en">PIXEL HERO · ONE MORE ROUND BEFORE BED</div>
    <div class="tgate" id="tgate"></div>
    <div class="tload" id="tload"><i id="tbar"></i><span id="ttx">载入中…</span></div>
    <button class="tenter" id="bCont" hidden><s></s><span>继续游戏</span><s></s></button>
    <button class="tenter" id="bStart" disabled><s></s><span>进入游戏</span><s></s></button>
  </div>
</div>

<!-- 备战页 -->
<div id="prep" class="scr menu">
  <!-- 11/22 选人出发（铃兰角色详情式）：左大立绘 + 人物切换；右 头牌 / 属性 / 起手兵器 / 开局宝物。习惯删除、加点挪到游戏内 -->
  <div class="pnew">
    <div class="pnL"><img id="pPort" alt="" hidden><canvas id="heroCv"></canvas></div>
    <div class="pnR">
      <div class="pnPick"><span>选择勇者</span><div class="pnSel csel" id="cSel"></div></div>
      <div class="pnHead" hidden><div id="hInfo"></div></div>
      <div class="pnSec"><h4>起手兵器</h4><div class="pnWep" id="wSel"></div><p class="weaponAttrHint" id="weaponAttrHint"></p><p class="wdesc" id="wDesc"></p></div>
      <div class="pnSec st"><h4>战斗演示</h4><div class="stage"><canvas id="demoCv"></canvas></div></div>
      <div class="pnFoot"><button class="btn" id="pBack">返回</button><button class="btn gold" id="pGo">出发！</button></div>
    </div>
  </div>
  <div hidden><div id="ptabs"><button data-t="w" class="on"></button></div><small id="aLeft"></small><button id="aReset"></button><div id="aRows"></div><div id="aStats"></div><div id="hSel"></div><div id="sSlots"></div><div id="bag"></div><div id="iSel"></div><p id="pTip"></p></div>
</div>

<!-- 战斗界面 -->
<div id="hud" class="scr">
  <div class="top">
    <div class="hp"><i id="hpGhost"></i><i id="hpBar"></i><span id="hpTxt"></span><em class="hrt"><svg viewBox="0 0 13 12" shape-rendering="crispEdges" width="26" height="24"><path fill="#1a0806" d="M2 0h3v1h1v1h1V1h1V0h3v1h1v1h1v4h-1v1h-1v1h-1v1H9v1H8v1H7v1H6v-1H5v-1H4V9H3V8H2V7H1V6H0V2h1V1h1z"/><path fill="#e83a2a" d="M2 1h3v1h1v1h1V2h1V1h3v1h1v4h-1v1h-1v1H9v1H8v1H7v1H6v-1H5V9H4V8H3V7H2V6H1V2h1z"/><path fill="#ff9a7a" d="M2 2h2v1H3v2H2z"/></svg></em><div id="lvBox"></div><div id="xpRow"><i id="xpBar2"></i></div></div>
    <div class="lv"><b id="lvTxt"></b><div class="xp"><i id="xpBar"></i></div></div>
    <div class="clock" id="clock"></div>
    <div id="lvUp">LEVEL UP!</div>
    <div class="kills" id="kills"></div>
    <div class="coins" id="coins"></div>
    <button class="btn sq" id="bPause">II</button>
  </div>
  <div id="feed"></div>
  <div id="combo"><b id="kN"></b><span>击倒</span><b id="cN"></b><span class="cl">连击</span></div>
  <div class="boss" id="bossBox"><b id="bossName">哥布林王</b><div class="bb"><i id="bossBar"></i></div></div>
  <div class="banner" id="banner"></div>
  <div class="sbar" id="sbar"></div>
  <div class="tip" id="tip"></div>
  <button class="btn round" id="bRoll"><span>翻滚</span><small id="rollKey">空格</small><i id="rollCd"></i><em id="rollT"></em><b class="pips" id="rollPips"></b></button>
</div>

<!-- 升级 / 暂停 / 结算 / 主界面的小面板 -->
<div id="levelup" class="scr over"><div class="panel box"><h2 id="luTitle">升级！</h2><div class="ups" id="ups"></div></div></div>
<div id="autoP"><div><b>II</b><span>已暂停 · 点一下继续</span></div></div>
<div id="pause" class="scr over camp"><div class="panel cbox">
  <div class="chead"><h2>暂停 · 备战</h2><span class="pTop"><button class="btn mini" data-panel="codex">图鉴</button><button class="btn mini" data-panel="set">设置</button><button class="btn mini" data-panel="help">帮助</button></span><span id="pCoin"></span></div>
  <div class="ctabs" id="pTabs"></div>
  <div class="cbody" id="pBody"></div>
  <div class="cfoot"><button class="btn mini" id="pHome">回主界面</button><button class="btn mini" id="pRe">重新开始</button><span class="sp"></span><button class="btn gold" id="pRes">继续游戏 ▶</button></div>
</div></div>
<!-- 波间结算页：结算 / 拾取 / 修炼 / 行商 / 技能 -->
<div id="camp" class="scr over camp"><div class="panel cbox">
  <div class="chead"><h2 id="cTitle"></h2><span id="cCoin"></span></div>
  <div class="ctabs" id="ctabs"></div>
  <div class="cbody" id="cBody"></div>
  <div class="cfoot"><span class="dim" id="cHint"></span><span class="sp"></span><button class="btn gold" id="cGo">继续</button></div>
</div></div>
<div id="route" class="scr over camp"><div class="panel box"><h2 id="rtTitle">选择下一站</h2><div class="rcards" id="rtCards"></div></div></div>
<div id="wmap" class="scr over"><div class="wmscroll" id="wmScroll"><div class="wm"><img src="art/ui2/map.webp" alt="" draggable="false"><div id="wmNodes"></div></div></div><div class="wmbar"><b id="wmTitle">卡带世界</b><span id="wmHint"></span><button class="btn gold" id="wmGo">继续 ▶</button></div></div>
<div id="confirm" class="scr over camp"><div class="panel cbox cfm"><div class="chead"><h2 id="cfT"></h2></div><p id="cfM"></p><div class="cfoot"><span class="sp"></span><button class="btn" id="cfNo">取消</button><button class="btn gold" id="cfYes"></button></div></div></div>
<iframe id="introF" title="开场"></iframe>
<div id="slotM"><div class="sbox"><h3>宝 箱</h3><div class="reels" id="reels"></div><div class="stip">点击跳过</div></div></div>
<div id="vict" class="scr over"><div class="vbox"><h2 id="vTitle"></h2><div class="vstamp">通 关</div><div class="vcols"><div class="vcol"><h4>战绩</h4><div id="vRec"></div><h4>输出</h4><div id="vDmg"></div></div><div class="vcol"><h4>成长</h4><div id="vGrow"></div><h4>本局收获</h4><div id="vGot"></div></div></div><div id="vNew"></div><div class="vfoot"><button id="vGo">继续 ▶</button></div></div></div>
<div id="toast"></div>
<div id="result" class="scr over"><div class="panel box"><h2 id="rTitle"></h2><p id="rMsg"></p><div class="stats" id="rStats"></div><div class="col"><button class="btn gold" id="rAgain">回到塔顶，再来一次 ▶</button><button class="btn" id="rWep" style="display:none">回备战页</button><button class="btn" id="rHome">回到主界面</button></div></div></div>
<div id="slotScr" class="scr over"><div class="slotBox"><button class="slotX" id="slotX" aria-label="关闭">✕</button><h2 id="slotT"></h2><div class="slotRow" id="slotRow"></div><div class="conWrap"><img class="console" id="sCon" src="art/ui2/save/console.png" alt=""><i class="led" id="sLed"></i></div><div class="slotForm" id="slotForm"><label>名　字<input id="sName" maxlength="8" autocomplete="off" placeholder="输入勇者的名字"></label><label>口　令<input id="sPin" type="password" maxlength="12" autocomplete="off" placeholder="输入口令，可以不输"></label><p class="slotErr" id="sErr"></p><div class="slotBtns"><button class="sbtn gold" id="sOk" hidden>开始游戏 ▶</button></div><p class="slotHint" id="sHint">点一个存档，或者把它拖进游戏机</p></div></div></div>
<div id="tpanel" class="scr over"><div class="panel box wide"><button id="tpX" aria-label="关闭">✕</button><h2 id="tpTitle"></h2><div id="tpBody"></div><div class="col"><button class="btn gold" id="tpClose">关闭</button></div></div></div>

<script src="js/tv.js"></script><script src="js/eggs.js"></script><script src="js/slot.js"></script>
<script src="js/sfx.js"></script><script src="js/bgm.js"></script>
<script src="js/data.js"></script>
<script src="js/jobs.js"></script>
<script src="js/sprites.js"></script>
<script src="js/skframes.js"></script>
<script src="js/skillfx.js"></script>
<script src="js/skills.js"></script>
<script src="js/lines.js"></script>
<script src="js/eskill.js"></script>
<script src="js/mech.js"></script>
<script src="js/battle.js"></script>
<script src="js/uiart.js"></script>
<script src="js/ui.js"></script>
<script src="js/titlefx.js"></script>
<script src="js/camp.js"></script>
<script src="js/debug.js"></script>
<script src="js/sim.js"></script>
</body></html>
