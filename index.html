<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07101b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="像素勇者">
<title>像素勇者</title>
<link rel="icon" type="image/png" href="art/ui/icon-192.png"><link rel="apple-touch-icon" href="art/ui/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" href="art/ui2/map.webp" as="image">
</head><body>
<canvas id="cv"></canvas>

<!-- 加载页：深夜卧室打游戏机（js/boot.js） -->

<!-- 主界面（照三国终章：左边大图，右边标题和「新的开始」，右上角 图鉴 / 设置 / 帮助） -->
<div id="title" class="scr on">
  <div class="tart"></div>
  <div class="ttop"><button class="btn mini" data-panel="codex">图鉴</button><button class="btn mini" data-panel="set">设置</button><button class="btn mini" data-panel="help">帮助</button></div>
  <div class="tbox">
    <div class="logo"><img class="lg1" src="art/title/logo.png" alt="像素勇者" draggable="false"><img class="lg2" src="art/title/logo2.png" alt="像素勇者" draggable="false"><i class="seal">肉鸽</i></div>
    <div class="sub"><s></s>深夜两点的冒险<s></s></div>
    <div class="en">PIXEL HERO · ONE MORE ROUND BEFORE BED</div>
    <div class="tload" id="tload"><i id="tbar"></i><span id="ttx">载入中…</span></div>
    <button class="btn big gold" id="bStart" disabled>新的开始</button>
  </div>
</div>

<!-- 备战页 -->
<div id="prep" class="scr menu">
  <div class="ptabs" id="ptabs"><button data-t="w" class="on">兵器</button><button data-t="a">属性</button><button data-t="h">习惯</button><button data-t="s">行囊</button></div>
  <div class="pcols">
    <div class="panel pc" data-t="w">
      <h3>勇者</h3>
      <div class="hstage"><canvas id="heroCv"></canvas><div class="hinfo" id="hInfo"></div></div>
      <h4>人物</h4>
      <div class="wsel csel" id="cSel"></div>
      <h4>起手兵器</h4>
      <div class="wsel" id="wSel"></div>
      <p class="wdesc" id="wDesc"></p>
    </div>
    <div class="panel pc" data-t="a">
      <h3>属性 <small id="aLeft"></small><button class="btn mini" id="aReset">重置</button></h3>
      <div id="aRows"></div>
      <div class="stats" id="aStats"></div>
      <h3 class="hh" data-t="h">现实习惯 <small>三选一，也可以不选</small></h3>
      <div class="habits" id="hSel" data-t="h"></div>
    </div>
    <div class="panel pc" data-t="s">
      <h3>技能栏 <small>按顺序轮流自动放出</small></h3>
      <div class="slots" id="sSlots"></div>
      <h3>开局宝物 <small>三选一，放进物品栏</small></h3>
      <div class="items" id="iSel"></div>
      <h3>物品栏</h3>
      <div class="bag" id="bag"></div>
      <p class="tipline" id="pTip"></p>
    </div>
  </div>
  <div class="foot"><button class="btn" id="pBack">返回</button><button class="btn gold" id="pGo">出发！</button></div>
</div>

<!-- 战斗界面 -->
<div id="hud" class="scr">
  <div class="top">
    <div class="hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
    <div class="lv"><b id="lvTxt"></b><div class="xp"><i id="xpBar"></i></div></div>
    <div class="clock" id="clock"></div>
    <div id="lvUp">LEVEL UP!</div>
    <div class="kills" id="kills"></div>
    <div class="coins" id="coins"></div>
    <button class="btn sq" id="bPause">II</button>
  </div>
  <div class="boss" id="bossBox"><b id="bossName">哥布林王</b><div class="bb"><i id="bossBar"></i></div></div>
  <div class="banner" id="banner"></div>
  <div class="sbar" id="sbar"></div>
  <div class="tip" id="tip"></div>
  <button class="btn round" id="bRoll"><span>翻滚</span><small id="rollKey">空格</small><i id="rollCd"></i><em id="rollT"></em></button>
</div>

<!-- 升级 / 暂停 / 结算 / 主界面的小面板 -->
<div id="levelup" class="scr over"><div class="panel box"><h2 id="luTitle">升级！</h2><div class="ups" id="ups"></div></div></div>
<div id="pause" class="scr over camp"><div class="panel cbox">
  <div class="chead"><h2>暂停 · 备战</h2><span id="pCoin"></span></div>
  <div class="ctabs" id="pTabs"></div>
  <div class="cbody" id="pBody"></div>
  <div class="cfoot"><button class="btn mini" id="pHome">回主界面</button><button class="btn mini" id="pRe">重新开始</button><span class="sp"></span><button class="btn gold" id="pRes">继续 ▶</button></div>
</div></div>
<!-- 波间结算页：结算 / 拾取 / 修炼 / 行商 / 技能 -->
<div id="camp" class="scr over camp"><div class="panel cbox">
  <div class="chead"><h2 id="cTitle"></h2><span id="cCoin"></span></div>
  <div class="ctabs" id="ctabs"></div>
  <div class="cbody" id="cBody"></div>
  <div class="cfoot"><span class="dim" id="cHint"></span><span class="sp"></span><button class="btn gold" id="cGo">继续</button></div>
</div></div>
<div id="route" class="scr over camp"><div class="panel box"><h2 id="rtTitle">选择下一站</h2><div class="rcards" id="rtCards"></div></div></div>
<div id="wmap" class="scr over"><div class="wmscroll" id="wmScroll"><div class="wm"><img src="art/ui2/map.webp" alt="" draggable="false"><div id="wmNodes"></div></div></div><div class="wmbar"><b id="wmTitle">卡带世界</b><span id="wmHint"></span><button class="btn gold" id="wmGo">继续 ▶</button></div></div>
<div id="toast"></div>
<div id="result" class="scr over"><div class="panel box"><h2 id="rTitle"></h2><p id="rMsg"></p><div class="stats" id="rStats"></div><div class="col"><button class="btn gold" id="rAgain">再来一次</button><button class="btn" id="rWep">回备战页</button><button class="btn" id="rHome">回主界面</button></div></div></div>
<div id="tpanel" class="scr over"><div class="panel box wide"><h2 id="tpTitle"></h2><div id="tpBody"></div><div class="col"><button class="btn gold" id="tpClose">关闭</button></div></div></div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/skframes.js"></script>
<script src="js/skills.js"></script>
<script src="js/battle.js"></script>
<script src="js/uiart.js"></script>
<script src="js/ui.js"></script>
<script src="js/camp.js"></script>
<script src="js/debug.js"></script>
</body></html>
