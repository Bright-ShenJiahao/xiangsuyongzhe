<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c18"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="像素勇者">
<title>像素勇者</title>
<link rel="icon" type="image/png" href="art/ui/icon-192.png"><link rel="apple-touch-icon" href="art/ui/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head><body>
<canvas id="cv"></canvas>

<!-- 主界面 -->
<div id="title" class="scr">
  <div class="tbox"><h1 class="logo">像素勇者</h1><p class="sub">深夜两点 · 被吸进游戏机的勇者</p></div>
  <button class="btn big" id="bStart">开始游戏</button>
  <div class="intro" id="intro"></div>
</div>

<!-- 武器选择 -->
<div id="weapon" class="scr menu">
  <div class="head"><h2>选择武器</h2><p>勇者会自动出手，你只管走位、翻滚</p></div>
  <div class="wbody">
    <div class="panel hero"><canvas id="heroCv"></canvas><b>勇者</b><small>深夜打游戏时被吸进来的玩家</small></div>
    <div class="cards" id="wCards"></div>
  </div>
  <div class="foot"><button class="btn" id="wBack">返回</button><button class="btn gold" id="wNext">选好了</button></div>
</div>

<!-- 地图选择 -->
<div id="mapsel" class="scr menu">
  <div class="head"><h2>选择地图</h2><p id="mWep"></p></div>
  <div class="maps" id="mCards"></div>
  <div class="foot"><button class="btn" id="mBack">返回</button><button class="btn gold" id="mGo">出发！</button></div>
</div>

<!-- 战斗界面 -->
<div id="hud" class="scr">
  <div class="top">
    <div class="hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
    <div class="lv"><b id="lvTxt"></b><div class="xp"><i id="xpBar"></i></div></div>
    <div class="clock" id="clock"></div>
    <div class="kills" id="speed"></div><div class="kills" id="kills"></div>
    <button class="btn sq" id="bPause">II</button>
  </div>
  <div class="boss" id="bossBox"><b id="bossName">哥布林王</b><div class="bb"><i id="bossBar"></i></div></div>
  <div class="banner" id="banner"></div>
  <div class="tip" id="tip"></div>
  <button class="btn round" id="bRoll">翻滚</button>
</div>

<!-- 升级 / 暂停 / 结算 -->
<div id="levelup" class="scr over"><div class="panel box"><h2 id="luTitle">升级！</h2><div class="ups" id="ups"></div></div></div>
<div id="pause" class="scr over"><div class="panel box"><h2>暂停</h2><div class="col"><button class="btn gold" id="pRes">继续</button><button class="btn" id="pRe">重新开始</button><button class="btn" id="pHome">回主界面</button></div></div></div>
<div id="result" class="scr over"><div class="panel box"><h2 id="rTitle"></h2><p id="rMsg"></p><div class="stats" id="rStats"></div><div class="col"><button class="btn gold" id="rAgain">再来一次</button><button class="btn" id="rWep">换武器</button><button class="btn" id="rHome">回主界面</button></div></div></div>

<div id="load" class="scr on"><b>载入中……</b></div>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/battle.js"></script>
<script src="art/cav/hero8/meta.js"></script><script src="art/cav/comp8/meta.js"></script><script src="art/cav/pcav8/meta.js"></script><script src="art/cav/spara/meta.js"></script><script src="art/cav/immortal/meta.js"></script><script src="art/cav/props/meta.js"></script>
<script src="js/cav.js"></script>
<script src="js/ui.js"></script>
<script src="js/debug.js"></script>
</body></html>
