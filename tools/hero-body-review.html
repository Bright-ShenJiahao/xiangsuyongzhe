<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>人物本体与落脚校准</title>
<style>body{margin:0;background:#211d29;color:#f0e5ce;font:16px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}select,button{font:inherit;background:#40364a;color:#fff;border:1px solid #9c88aa;padding:5px}p{margin:8px 12px;font-size:14px}canvas{display:block;width:100%;max-width:1440px;image-rendering:pixelated;background:#dfd4b4}#status{padding:12px}</style></head><body>
<header><b>人物本体与落脚校准</b><label>武器 <select id="weapon"><option value="sword">剑</option><option value="spear">枪</option><option value="bow">弓</option><option value="staff">法杖</option><option value="tome">圣典</option><option value="gun">掌机</option><option value="scythe">镰刀</option></select></label><label>动作 <select id="action"><option value="idle">待机呼吸</option><option value="run">跑步</option><option value="atk">出手</option><option value="big">大招</option><option value="roll">翻滚</option><option value="back">后撤</option></select></label><label><input id="flip" type="checkbox">朝左</label><button id="play">暂停</button><button id="step">下一帧</button></header>
<p>绿线＝固定脚底锚点；金线＝公主站立本体高度参考。羽毛、天线、角、皇冠和帽子允许超过金线；跑步、蹲伏与翻滚保留动作姿势。</p>
<div id="status">载入中…</div><canvas id="review" width="1440" height="780"></canvas>
<script src="js/data.js"></script><script src="js/sprites.js"></script><script>
(async()=>{try{await SPR.load();const ids=['p','m','f','e','v','s','k','r','w','j','q','c'];const cv=document.querySelector('canvas'),g=cv.getContext('2d');let playing=true,t=0,last=performance.now();document.querySelector('#status').textContent='12位角色，实时使用游戏图集与实际 ax/ay。';
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';};document.querySelector('#step').onclick=()=>{playing=false;t+=.125;document.querySelector('#play').textContent='播放';};
function loop(now){if(playing)t+=Math.min(.1,(now-last)/1000);last=now;g.clearRect(0,0,cv.width,cv.height);g.imageSmoothingEnabled=false;const w=document.querySelector('#weapon').value,n=document.querySelector('#action').value,flip=document.querySelector('#flip').checked,u=3;
ids.forEach((id,i)=>{const x=(i%4)*360+180,y=Math.floor(i/4)*260+210;g.strokeStyle='#27814c';g.beginPath();g.moveTo(x-145,y);g.lineTo(x+145,y);g.stroke();g.strokeStyle='#ae8b35';g.beginPath();g.moveTo(x-145,y-38*u);g.lineTo(x+145,y-38*u);g.stroke();g.strokeStyle='#b4a889';g.beginPath();g.moveTo(x,y-180);g.lineTo(x,y+6);g.stroke();const frameW=id==='p'?({gun:'bow',tome:'staff',scythe:'sword'}[w]||w):w;SPR.drawHero(g,n,Math.floor(t*(n==='idle'?3:8))%Math.max(1,SPR.count(SPR.heroSet(id,w),frameW+'.'+n)),x,y,flip,u,{c:id,w});g.fillStyle='#2e2331';g.font='17px system-ui';g.fillText(DATA.heroes.find(h=>h.id===id)?.name||id,x-100,y+28);});requestAnimationFrame(loop);}requestAnimationFrame(loop);
}catch(e){document.querySelector('#status').textContent=String(e);}})();
</script></body></html>
